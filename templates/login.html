<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Nova POS</title><script>document.documentElement.dataset.theme=localStorage.getItem('pos-theme')||'light'</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/pos.css"></head>
<body class="auth ref">
<div class="ref-bg"></div>
<i class="dot ring-pu" style="--s:104px;--t:-34px;--r:-30px"></i>
<i class="dot fill-am" style="--s:34px;--t:44px;--r:26%"></i>
<i class="dot fill-pu" style="--s:72px;--t:34%;--r:16%"></i>
<i class="dot fill-am" style="--s:158px;--t:58%;--r:8%"></i>
<i class="dot fill-pu" style="--s:118px;--b:-40px;--r:-18px"></i>
<i class="dot fill-pu" style="--s:34px;--b:9%;--r:30%"></i>
<i class="dot ring-am" style="--s:88px;--b:-38px;--l:46%"></i>
<div class="ref-card anim">
  <h1 class="ref-title">Welcome Back</h1>
  <form id="f">
    <div class="ref-field">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.6-3.2 4.6-5 8-5s6.4 1.8 8 5"/></svg>
      <input name="username" autocomplete="username" placeholder="Username" required autofocus>
    </div>
    <div class="ref-field">
      <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <input name="password" type="password" id="pw" autocomplete="current-password" placeholder="Password" required>
      <button type="button" id="eye" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.5 10.7a2.5 2.5 0 0 0 3.5 3.5M7.4 7.6C4.9 9.1 3.2 12 3.2 12s3.6 6 8.8 6c1.5 0 2.9-.4 4.1-1.1M9.9 5.1A9 9 0 0 1 12 4.8c5.2 0 8.8 6 8.8 6s-.7 1.1-1.9 2.4"/></svg></button>
    </div>
    <div class="ref-row">
      <label class="ref-check"><input type="checkbox" id="rem"><span>Remember Password</span></label>
      <a id="fg" class="ref-link">Forgot Password</a>
    </div>
    <button type="submit" class="ref-login">Login</button>
    <p class="err" id="err"></p>
  </form>
  <div id="fgbox" class="hide">
    <div class="ref-field">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.6-3.2 4.6-5 8-5s6.4 1.8 8 5"/></svg>
      <input id="fgu" autocomplete="username" placeholder="Your username">
    </div>
    <button class="ref-login" id="fgsend" style="height:46px;font-size:14px">Request reset</button>
    <p class="hint" id="fgmsg"></p>
  </div>
  <p class="ref-signup">Don't Have an Account? <a id="su" class="ref-link">Sign Up</a></p>
  <p class="hint" id="sumsg" class="hide"></p>
  <p class="hint">demo: <code>admin / admin123</code> · <code>cashier / cashier123</code></p>
</div>
<script>
eye.onclick=()=>{const o=pw.type==='password';pw.type=o?'text':'password';eye.classList.toggle('on',o)};
su.onclick=()=>{sumsg.textContent='Accounts are created by your admin — ask them to add you under Users.';sumsg.classList.remove('hide')};
fg.onclick=()=>fgbox.classList.toggle('hide');
fgsend.onclick=async()=>{await fetch('/api/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:fgu.value})});
  fgmsg.textContent='If that account exists, a reset request was sent to your admin. Ask them to approve it under Users → Reset requests.'};
rem.checked=!!localStorage.getItem('pos-rem');
if(rem.checked)f.username.value=localStorage.getItem('pos-rem');
f.onsubmit = async e => { e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  const r = await fetch('/api/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
  if (r.ok){rem.checked?localStorage.setItem('pos-rem',d.username):localStorage.removeItem('pos-rem');location.reload()}
  else err.textContent = (await r.json()).error;
};
</script></body></html>
