<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova POS</title><script>document.documentElement.dataset.theme=localStorage.getItem('pos-theme')||'light'</script>
<script src="/static/html5-qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/pos.css"></head><body>
<div class="shell">
<nav>
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M3 4h3l2.4 12.2A2 2 0 0 0 10.4 18h7.8a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="11" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/></svg></span><div><h1>Nova POS</h1><p id="store"></p></div></div>
  <a data-s="dash" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Dashboard</span></a>
  <a data-s="pos"><svg viewBox="0 0 24 24"><path d="M3 4h3l2.4 12.2A2 2 0 0 0 10.4 18h7.8a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="11" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/></svg><span>Point of Sale</span></a>
  <a data-s="products"><svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></svg><span>Products</span></a>
  <a data-s="inv"><svg viewBox="0 0 24 24"><path d="M21 12v6H3v-6M3 12l3-7h12l3 7zM10 15h4"/></svg><span>Inventory</span></a>
  <a data-s="orders"><svg viewBox="0 0 24 24"><path d="M5 3h14v18l-2-1.5L15 21l-2-1.5L11 21l-2-1.5L7 21l-2-1.5z"/><path d="M9 8h6M9 12h6"/></svg><span>Sales</span></a>
  <a data-s="reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Reports</span></a>
  <a data-s="users" class="adm hide"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1.2-3 3.8-4.5 6.5-4.5s5.3 1.5 6.5 4.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 15.3c2 .2 4 1.4 5 3.7"/></svg><span>Users</span></a>
  <a data-s="devices" class="adm hide"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10 19h4"/></svg><span>Devices</span></a>
  <a data-s="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3 1a7.7 7.7 0 0 0-2.6-1.5L14 2.6h-4l-.5 2.5a7.7 7.7 0 0 0-2.6 1.5l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-1a7.7 7.7 0 0 0 2.6 1.5l.5 2.5h4l.5-2.5a7.7 7.7 0 0 0 2.6-1.5l2.3 1 2-3.4z"/></svg><span>Settings</span></a>
  <a data-s="docs"><svg viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17.5a2.5 2.5 0 0 1-2.5 2.5H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M9 7h7"/></svg><span>Docs</span></a>
  <div class="foot">
    <div class="u"><span class="av" id="uav"></span><div><b id="uname"></b><i id="urole"></i></div></div>
    <a id="themeTgl"><span>Dark mode</span><i class="sw"></i></a>
    <a id="logout"><svg viewBox="0 0 24 24"><path d="M14 4H6v16h8M10 12h11M18 8l3 4-3 4"/></svg><span>Sign out</span></a>
  </div>
</nav>
<div class="wrap">
  <header class="topbar">
    <button id="ham" class="tb-btn" aria-label="Toggle menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="tb-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg><input id="gs" placeholder="Search products, orders…" autocomplete="off"></div>
    <div class="tb-right">
      <button id="bell" class="tb-btn" aria-label="Low stock alerts"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg><i class="bdg hide" id="lowcnt"></i></button>
      <button class="tb-user" id="tuser"><span class="av" id="uav2"></span><span id="uname2"></span><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
    </div>
  </header>
  <main id="main"></main>
</div>
</div>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s), M=$("#main"), cur="$";
let S={cart:[],products:[],boot:{}};
const api=async(p,o)=>{const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o,body:o&&o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(r.status===401){location.reload();throw j}if(!r.ok){toast(j.error||'Error',1);throw j}return j};
const money=n=>(S.boot.settings?.currency||'$')+Number(n||0).toFixed(2);
const tm=s=>new Date((s||'').replace(' ','T')+'Z').toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});   // UTC → local
const td=s=>new Date((s||'').replace(' ','T')+'Z').toLocaleString();
const toast=(m,bad)=>{const t=document.createElement('div');t.className='toast';if(bad)t.style.borderColor='var(--bad)';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)};
const modal=h=>{$("#modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div>${h}</div></div>`};
const closeM=()=>$("#modal").innerHTML="";
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const NAV={dash:pgDash,pos:pgPos,products:pgProducts,inv:pgInv,orders:pgOrders,reports:pgReports,users:pgUsers,devices:pgDevices,settings:pgSettings,docs:pgDocs};
window.renameShop=()=>modal(`<h3>Shop name</h3><form onsubmit="renameSave(event)"><label>Store name<input name="store_name" value="${esc(S.boot.settings.store_name)}" autofocus required></label>
  <div class="row"><button type="button" class="btn" style="flex:1" onclick="closeM()">Cancel</button><button class="btn primary" style="flex:2">Rename</button></div></form>`);
window.renameSave=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
  await api('/api/settings',{method:'PUT',body:d});S.boot.settings.store_name=d.store_name;store.textContent=d.store_name;
  closeM();toast('Shop renamed to '+d.store_name)};
document.querySelectorAll('nav a[data-s]').forEach(a=>a.onclick=()=>{document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');history.replaceState(null,"","#"+a.dataset.s);clearInterval(window._poll);window._poll=null;NAV[a.dataset.s]()});
window.go=s=>document.querySelector(`nav a[data-s="${s}"]`).click();
const tgl=document.getElementById('themeTgl');
const themeLbl=()=>{const d=document.documentElement.dataset.theme==='dark';tgl.querySelector('.sw').classList.toggle('on',d);tgl.querySelector('span').textContent=d?'Light mode':'Dark mode'};
tgl.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';localStorage.setItem('pos-theme',document.documentElement.dataset.theme);themeLbl()};
themeLbl();
$("#logout").onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
ham.onclick=()=>document.body.classList.toggle('nav-mini');
bell.onclick=()=>go('inv');
tuser.onclick=()=>{if(S.boot.user.role==='admin')go('users')};
gs.onkeydown=e=>{if(e.key==='Enter'&&gs.value.trim()){S.q=gs.value.trim();go('products')}};

async function boot(){
  S.boot=await api('/api/bootstrap');
  uname.textContent=S.boot.user.name;urole.textContent=S.boot.user.role;
  uav.textContent=uav2.textContent=(S.boot.user.name||'?')[0].toUpperCase();uname2.textContent=S.boot.user.name;
  store.textContent=S.boot.settings.store_name;
  if(S.boot.user.role==='admin'){document.querySelectorAll('.adm').forEach(e=>e.classList.remove('hide'));
    store.style.cursor='pointer';store.title='Click to rename shop';store.onclick=renameShop}
  api('/api/dashboard').then(d=>{if(d.low_stock.length){lowcnt.textContent=d.low_stock.length;lowcnt.classList.remove('hide')}}).catch(()=>{});
  const h=location.hash.slice(1);
  if(h&&NAV[h]){document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));document.querySelector(`nav a[data-s="${h}"]`).classList.add('on');NAV[h]()}else pgDash();
  if(S.boot.user.must_change)modal(`<h3>Set a new password</h3><p class="sub" style="margin-bottom:12px">Your password was reset — choose a new one to continue.</p>
    <form onsubmit="forcePw(event)"><label>New password<input name="password" type="password" minlength="6" required autofocus></label>
    <button class="btn primary block">Save password</button></form>`);
}
window.forcePw=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
  await api(`/api/users/${S.boot.user.id}/password`,{method:'POST',body:d});S.boot.user.must_change=false;closeM();toast('Password updated')};

/* ---------- Dashboard ---------- */
const ICO={cart:'<svg viewBox="0 0 24 24"><path d="M3 4h3l2.4 12.2A2 2 0 0 0 10.4 18h7.8a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="11" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/></svg>',
box:'<svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></svg>',
chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
alert:'<svg viewBox="0 0 24 24"><path d="M12 3l10 17H2z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
rcpt:'<svg viewBox="0 0 24 24"><path d="M5 3h14v18l-2-1.5L15 21l-2-1.5L11 21l-2-1.5L7 21l-2-1.5z"/><path d="M9 8h6M9 12h6"/></svg>',
cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'};
const limg=p=>p.image?`<img class="limg" src="${esc(p.image)}" loading="lazy" onerror="this.outerHTML='<div class=limg>📦</div>'">`:'<div class="limg">📦</div>';
async function pgDash(){
  const d=await api('/api/dashboard');
  M.innerHTML=`<div class="top"><div><h1>Dashboard</h1><p class="sub" style="margin-top:4px">Welcome back! Here's what's happening in your store today.</p></div>
    <span class="date-pill">${ICO.cal} ${new Date().toDateString()}</span></div>
  <div class="grid cards">
    <div class="kpi pu"><div class="kpi-i">${ICO.chart}</div><div><div class="k">Today's revenue</div><div class="v">${money(d.today.revenue)}</div><div class="s">${d.today.orders} orders</div></div><svg class="deco" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
    <div class="kpi mi"><div class="kpi-i">${ICO.box}</div><div><div class="k">Products</div><div class="v">${d.products}</div><div class="s">in catalogue</div></div><svg class="deco" viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></svg></div>
    <div class="kpi am"><div class="kpi-i">${ICO.chart}</div><div><div class="k">Stock value</div><div class="v">${money(d.stock_value.v)}</div><div class="s">at cost</div></div><svg class="deco" viewBox="0 0 24 24"><circle cx="9" cy="9" r="6"/><path d="M14 6h6M14 10h6M14 14h6M14 18h6"/></svg></div>
    <div class="kpi bl"><div class="kpi-i">${ICO.box}</div><div><div class="k">Low stock</div><div class="v">${d.low_stock.length}</div><div class="s">items ≤ 10 units</div></div><svg class="deco" viewBox="0 0 24 24"><path d="M12 3l10 17H2z"/><path d="M12 10v4M12 17.5v.5"/></svg></div>
  </div>
  <div class="grid cols" style="align-items:start">
    <div style="display:grid;gap:16px">
      <div class="card"><div class="ph"><span class="pi">${ICO.cart}</span><h2>Top Sellers</h2><span class="ph-col">Units Sold</span></div>
        ${d.top.map(t=>`<div class="li">${limg(t)}<span class="nm">${esc(t.name)}</span><b>${t.qty}</b></div>`).join('')||'<p class="hint">No sales yet</p>'}</div>
      <div class="card"><div class="ph"><span class="pi">${ICO.clock}</span><h2>Expiring Soon (30d)</h2><span class="ph-col">Expiry</span></div>
        ${(d.expiring||[]).map(t=>`<div class="li">${limg(t)}<span class="nm">${esc(t.name)} <span class="sub">×${t.stock}</span></span><span class="badge ${new Date(t.expiry)<new Date()?'bad':'warn'}">${t.expiry}</span></div>`).join('')||'<p class="hint">Nothing expiring</p>'}</div>
    </div>
    <div class="card"><div class="ph"><span class="pi">${ICO.alert}</span><h2>Needs Restock</h2><span class="ph-col">Stock</span></div>
      ${d.low_stock.map(t=>`<div class="li">${limg(t)}<span class="nm">${esc(t.name)}</span><span class="badge warn">${t.stock} left</span></div>`).join('')||'<p class="hint">All stocked ✓</p>'}</div>
  </div>
  <div class="card section"><div class="ph"><span class="pi">${ICO.rcpt}</span><h2>Recent Orders</h2><a class="viewall" onclick="go('orders')">View All →</a></div>
    <table><tr><th>Invoice</th><th>Cashier</th><th>Time</th><th>Status</th><th style="text-align:right">Total</th></tr>
    ${d.recent.map(r=>`<tr><td class="mono">${r.invoice_no}</td><td>${esc(r.cashier||'—')}</td><td>${tm(r.created)}</td><td><span class="badge ${r.status==='void'?'bad':'ok'}">${r.status}</span></td><td style="text-align:right"><b>${money(r.total)}</b></td></tr>`).join('')||'<tr><td colspan=5>No orders yet</td></tr>'}</table></div>`;
}

/* ---------- POS ---------- */
async function pgPos(){
  S.cart=[];
  M.innerHTML=`<div class="top"><h1>Point of Sale</h1><span class="sub">Scan a barcode or click a product</span></div>
  <div class="pos"><div>
    <div class="searchbox"><input id="ps" placeholder="Search or scan barcode…" autocomplete="off">
      <button class="btn" id="camscan" onclick="camScan('ps')" title="Scan barcode with camera">📷 Scan</button></div>
    <div class="pgrid" id="pg"></div>
  </div>
  <div class="cart"><h2>Current sale</h2><div id="ci"></div>
    <div class="total"><span>Total</span><b id="ct">KSh 0.00</b></div><p class="sub" id="cvat" style="margin:-8px 0 10px"></p>
    <div class="row"><button class="btn" onclick="parkSale()">Park</button><button class="btn" id="hbtn" onclick="listHeld()">Held</button>
    <button class="btn" onclick="S.cart=[];drawCart()">Clear</button>
    <button class="btn primary" style="flex:2" onclick="pay()">Charge</button></div></div></div>`;
  const load=async()=>{S.products=await api('/api/lookup?q='+encodeURIComponent(ps.value));
    pg.innerHTML=S.products.map(p=>`<button class="pitem" onclick="addItem(${p.id})">${p.image?`<img class="pimg" src="${esc(p.image)}" loading="lazy" onerror="this.remove()">`:'<div class="pimg ph">📦</div>'}<div class="nm">${esc(p.name)}</div><div class="pr">${money(p.price)}</div><div class="st ${p.stock<=10?'low':''}">${p.stock} in stock${p.barcode?' · '+esc(p.barcode):''}</div>${p.discount_qty>0?`<div class="deal">Buy ${p.discount_qty}+ save ${p.discount_pct}%</div>`:''}</button>`).join('')||'<p class="hint">No products match</p>'};
  ps.oninput=load; ps.onkeydown=e=>{if(e.key==='Enter'&&S.products[0]){addItem(S.products[0].id);ps.value='';load()}};
  ps.focus(); load(); heldCount();
}
window.addItem=id=>{const p=S.products.find(x=>x.id===id);const it=S.cart.find(x=>x.id===id);
  if(p.stock<=0)return toast('Out of stock',1);
  it?it.qty++:S.cart.push({id,name:p.name,price:p.price,qty:1,taxable:p.taxable??1,dq:p.discount_qty||0,dp:p.discount_pct||0});drawCart()};
const lineOf=i=>i.price*i.qty*(i.dq>0&&i.qty>=i.dq?1-(i.dp||0)/100:1);
const totOf=()=>S.cart.reduce((a,i)=>a+lineOf(i),0);
const vatOf=()=>{const r=+(S.boot.settings.tax_rate||0);return S.cart.reduce((a,i)=>a+(i.taxable?lineOf(i)*r/(100+r):0),0)};
window.drawCart=()=>{ci.innerHTML=S.cart.map((i,x)=>`<div class="ci"><span class="nm">${esc(i.name)}${i.dq>0&&i.qty>=i.dq?` <span class="badge ok">−${i.dp}%</span>`:''}</span><span class="q"><button onclick="cq(${x},-1)">−</button><b>${i.qty}</b><button onclick="cq(${x},1)">+</button></span><b style="width:64px;text-align:right">${money(lineOf(i))}</b></div>`).join('')||'<p class="hint">Cart is empty</p>';
  ct.textContent=money(totOf());
  cvat.textContent=vatOf()>0.004?`incl. VAT ${S.boot.settings.tax_rate}% · ${money(vatOf())}`:''};
window.cq=(x,d)=>{S.cart[x].qty+=d;if(S.cart[x].qty<=0)S.cart.splice(x,1);drawCart()};
window.pay=()=>{const t=totOf();if(!t)return;
  modal(`<h3>Settle payment</h3><p class="sub" style="margin-bottom:12px">Total due <b>${money(t)}</b></p>
    <label>Cash received<input id="cash" type="number" step="0.01" value="${t.toFixed(2)}" autofocus></label>
    <p style="margin:10px 0">Change: <b id="chg">${money(0)}</b></p>
    <div class="row"><button type="button" class="btn" style="flex:1" onclick="closeM()">Cancel</button><button class="btn primary" style="flex:2" onclick="doPay(${t})">Complete sale</button></div>`);
  cash.oninput=()=>chg.textContent=money(Math.max(0,cash.value-t))};
window.parkSale=async()=>{if(!S.cart.length)return toast('Cart is empty');
  const label=prompt('Name this held sale (e.g. customer name):','Customer');if(label===null)return;
  await api('/api/held',{method:'POST',body:{label,items:S.cart}});S.cart=[];drawCart();heldCount();toast('Sale parked')};
window.listHeld=async()=>{const hs=await api('/api/held');
  modal(`<h3>Held sales</h3>${hs.map(h=>`<div class="ci"><span class="nm">${esc(h.label)}</span><span class="sub">${h.created.slice(5,16)} · ${esc(h.cashier||'')}</span>
    <span><button class="btn small primary" onclick="recall(${h.id})">Recall</button> <button class="btn small danger" onclick="delHeld(${h.id})">✕</button></span></div>`).join('')||'<p class="hint">Nothing parked</p>'}`)};
window.recall=async id=>{const h=await api('/api/held/'+id);S.cart=h.items;await api('/api/held/'+id,{method:'DELETE'});
  closeM();drawCart();heldCount();toast('Recalled '+h.label)};
window.delHeld=async id=>{await api('/api/held/'+id,{method:'DELETE'});closeM();listHeld();heldCount()};
window.heldCount=async()=>{const hs=await api('/api/held');const b=document.getElementById('hbtn');if(b)b.textContent='Held'+(hs.length?' ('+hs.length+')':'')};
window.doPay=async t=>{const r=await api('/api/checkout',{method:'POST',body:{items:S.cart,cash:+cash.value}});
  closeM();S.cart=[];pgPos();
  const rc=await api('/api/receipt/'+r.id);
  modal(`<h3>Receipt · ${r.invoice}</h3><div class="rc" id="rc">${rcHtml(rc)}</div>
    <div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Close</button>
    <button class="btn primary" style="flex:2" onclick="print()">Print receipt</button></div>`);
  toast(`Sale ${r.invoice} · change ${money(r.change)}`)};
const rcHtml=rc=>`<h4>${esc(rc.settings.store_name)}</h4><p class="c">${esc(rc.settings.store_address)}<br>${esc(rc.settings.store_phone)}</p><hr>
  <table>${rc.items.map(i=>`<tr><td>${esc(i.name)} ×${i.qty}</td><td style="text-align:right">${money(i.total)}</td></tr>`).join('')}</table><hr>
  <table>${rc.sale.discount>0?`<tr><td>Discounts</td><td style="text-align:right">−${money(rc.sale.discount)}</td></tr>`:''}
  <tr><td>Subtotal (excl. VAT)</td><td style="text-align:right">${money(rc.sale.total-(rc.sale.vat||0))}</td></tr>
  <tr><td>VAT ${rc.settings.tax_rate||0}%</td><td style="text-align:right">${money(rc.sale.vat||0)}</td></tr>
  <tr><td><b>Total</b></td><td style="text-align:right"><b>${money(rc.sale.total)}</b></td></tr>
  <tr><td>Cash</td><td style="text-align:right">${money(rc.sale.cash)}</td></tr>
  <tr><td>Change</td><td style="text-align:right">${money(rc.sale.change_due)}</td></tr></table><hr>
  <p class="c">${rc.sale.invoice_no} · ${td(rc.sale.created)}<br>Served by ${esc(rc.sale.cashier||'')}</p>`;

/* ---------- Products ---------- */
async function pgProducts(){
  const[ps,cs,bs,ss,pr]=await Promise.all([api('/api/products'),api('/api/lookup/categories'),api('/api/lookup/brands'),api('/api/lookup/suppliers'),api('/api/promos')]);
  S.boot.categories=cs;S.boot.brands=bs;S.boot.suppliers=ss;S.prods=ps;
  const adm=S.boot.user.role==='admin';
  M.innerHTML=`<div class="top"><h1>Products</h1>${adm?'<span><button class="btn" onclick="impForm()">📄 Import</button> <button class="btn primary" onclick="pForm()">+ New product</button></span>':''}</div>
  <div class="toolbar"><input id="pq" placeholder="Filter…"><button class="btn" onclick="camScan('pq')" title="Scan barcode">📷 Scan</button><span class="sub">${ps.length} items</span></div>
  <div class="card section"><table><tr><th></th><th>Barcode</th><th>Name</th><th>Category</th><th>Brand</th><th style="text-align:right">Cost</th><th style="text-align:right">Price</th><th style="text-align:right">Stock</th>${adm?'<th></th>':''}</tr>
  <tbody id="pt"></tbody></table></div>
  <div class="grid cols section">
    <div class="card"><h2>Categories &amp; Brands</h2>${lkForm('categories',cs)}<hr style="border-color:var(--line);margin:14px 0">${lkForm('brands',bs)}</div>
    <div class="card"><h2>Suppliers</h2>${lkForm('suppliers',ss,true)}</div>
    <div class="card"><h2>Promo codes</h2>${promoHTML(pr)}</div></div>`;
  const draw=list=>pt.innerHTML=list.map(p=>`<tr><td style="width:56px">${p.image?`<img class="timg" src="${esc(p.image)}" loading="lazy" onerror="this.remove()">`:'<div class="timg ph">📦</div>'}</td><td class="mono">${esc(p.barcode)}</td><td>${esc(p.name)}${p.variant_label?` <span class="badge warn">${esc(p.variant_label)}</span>`:''}${p.pack_size>1?` <span class="badge ok">pack ×${p.pack_size}</span>`:''}${p.taxable?'':' <span class="badge warn">VAT-exempt</span>'}${p.discount_qty>0?` <span class="badge ok">${p.discount_qty}+ −${p.discount_pct}%</span>`:''}${p.expiry?` <span class="badge ${new Date(p.expiry)<new Date(Date.now()+30*864e5)?'bad':'warn'}">exp ${p.expiry}</span>`:''}</td><td>${esc(p.category||'—')}</td><td>${esc(p.brand||'—')}</td><td style="text-align:right">${money(p.cost)}</td><td style="text-align:right"><b>${money(p.price)}</b></td><td style="text-align:right"><span class="badge ${p.stock<=10?'warn':'ok'}">${p.stock}</span></td>${adm?`<td style="text-align:right"><button class="btn small" onclick='pForm(${JSON.stringify(p)})'>Edit</button> <button class="btn small danger" onclick="pdel(${p.id})">✕</button>`:''}</tr>`).join('');
  draw(ps);pq.oninput=()=>draw(ps.filter(p=>p.name.toLowerCase().includes(pq.value.toLowerCase())||String(p.barcode).includes(pq.value)));
  if(S.q){pq.value=S.q;pq.dispatchEvent(new Event('input'));S.q=''}
}
const lkForm=(k,list,full)=>`<form onsubmit="lkAdd(event,'${k}',${full})" class="row" style="margin-bottom:12px"><input name="name" placeholder="New ${k.slice(0,-1)}…" required style="flex:2">${full?'<input name="contact" placeholder="Contact"><input name="phone" placeholder="Phone">':''}<button class="btn">Add</button></form>
  ${list.map(x=>`<span class="badge ok" style="margin:0 6px 6px 0;display:inline-block">${esc(x.name)}</span>`).join('')}`;
const promoHTML=list=>`<form onsubmit="promoAdd(event)" class="row" style="margin-bottom:12px"><input name="code" placeholder="Code" required style="flex:2;text-transform:uppercase"><select name="kind"><option value="pct">% off</option><option value="abs">KSh off</option></select><input name="value" type="number" step="0.01" placeholder="Value" required style="flex:1"><input name="min_total" type="number" step="0.01" placeholder="Min KSh" style="flex:1"><button class="btn">Add</button></form>
  ${list.map(p=>`<span class="badge ${p.active?'ok':'bad'}" style="margin:0 6px 6px 0;display:inline-block">${esc(p.code)} ${p.kind==='pct'?p.value+'%':'KSh '+p.value}${p.min_total?` (≥${money(p.min_total)})`:''} ${p.active?`<a href="#" onclick="promoDel(${p.id});return false" style="color:inherit">✕</a>`:''}</span>`).join('')||'<p class="hint">No promo codes yet</p>'}`;
window.promoAdd=async e=>{e.preventDefault();await api('/api/promos',{method:'POST',body:Object.fromEntries(new FormData(e.target))});pgProducts()};
window.promoDel=async id=>{await api('/api/promos/'+id+'/delete',{method:'POST'});pgProducts()};
window.lkAdd=async(e,k,f)=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await api('/api/lookup/'+k,{method:'POST',body:d});toast('Added');pgProducts()};
window.pForm=(p={})=>{modal(`<h3>${p.id?'Edit':'New'} product</h3><form onsubmit="pSave(event,${p.id||0})">
  <div class="row"><label>Barcode<input name="barcode" value="${esc(p.barcode||'')}" required></label><label>Price<input name="price" type="number" step="0.01" value="${p.price??''}" required></label><label>Wholesale<input name="price_wholesale" type="number" step="0.01" value="${p.price_wholesale??''}" placeholder="optional"></label></div>
  <label>Name<input name="name" value="${esc(p.name||'')}" required></label>
  <div class="row"><label>Category<select name="category_id">${S.boot.categories.map(c=>`<option value=${c.id} ${c.id===p.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
  <label>Brand<select name="brand_id">${S.boot.brands.map(b=>`<option value=${b.id} ${b.id===p.brand_id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label></div>
  <div class="row"><label>Variant of<select name="parent_id"><option value="">— not a variant —</option>${(S.prods||[]).filter(x=>!x.parent_id&&x.id!==p.id).map(x=>`<option value=${x.id} ${x.id===p.parent_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
  <label>Variant label<input name="variant_label" value="${esc(p.variant_label||'')}" placeholder="e.g. Large / 500ml"></label></div>
  <div class="row"><label>Cost<input name="cost" type="number" step="0.01" value="${p.cost??0}"></label><label>Stock<input name="stock" type="number" step="0.01" value="${p.stock??0}"></label><label>Pack size<input name="pack_size" type="number" step="1" min="0" value="${p.pack_size??0}" title="Units per pack — 0 disables"></label><label>Pack price<input name="pack_price" type="number" step="0.01" value="${p.pack_price??''}" placeholder="optional"></label></div>
  <div class="row"><label>Bulk deal qty<input name="discount_qty" type="number" step="1" min="0" value="${p.discount_qty??0}" title="Buy this many to get the discount — 0 disables"></label><label>Deal % off<input name="discount_pct" type="number" step="0.1" min="0" max="100" value="${p.discount_pct??0}"></label><label>Expiry<input name="expiry" type="date" value="${p.expiry||''}"></label></div>
  <label>Image URL<input name="image" id="pfimg" value="${esc(p.image||'')}" placeholder="https://…" oninput="document.getElementById('pfprev').src=this.value"></label>
  <div class="row" style="align-items:center;gap:12px"><img id="pfprev" class="timg" src="${esc(p.image||'')}" style="width:64px;height:64px" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'">
    <button type="button" class="btn small" onclick="findImgs(document.querySelector('[name=name]').value)">🔍 Find online</button>
    <label class="btn small" style="cursor:pointer;margin:0">📁 Upload<input type="file" accept="image/*" hidden onchange="upImg(this)"></label>
    <button type="button" class="btn small" onclick="pfimg.value='';pfprev.style.visibility='hidden'">Remove</button></div>
  <div id="imgpick" class="row" style="flex-wrap:wrap"></div>
  <label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text)"><input type="checkbox" name="taxable" ${p.taxable===0?'':'checked'} style="width:auto"> Charge ${S.boot.settings.tax_rate||16}% VAT (uncheck for VAT-exempt items)</label>
  <div class="row"><button type="button" class="btn" style="flex:1" onclick="closeM()">Cancel</button><button class="btn primary" style="flex:2">Save</button></div></form>`)};
window.findImgs=async q=>{const p=document.getElementById('imgpick');p.innerHTML='<span class="sub">Searching…</span>';
  const urls=await api('/api/image-search?q='+encodeURIComponent(q||''));
  p.innerHTML=urls.map(u=>`<img class="timg" style="width:64px;height:64px;cursor:pointer" src="${u}" onclick="pfimg.value=this.src;pfprev.src=this.src;pfprev.style.visibility='visible';imgpick.innerHTML=''">`).join('')||'<span class="sub">No images found</span>'};
window.upImg=async el=>{const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{const u=await api('/api/upload',{method:'POST',body:{data:r.result}});
    pfimg.value=u.url;pfprev.src=u.url;pfprev.style.visibility='visible';toast('Image uploaded')};
  r.readAsDataURL(f)};
window.pSave=async(e,id)=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
  ['price','stock','cost','category_id','brand_id','discount_qty','discount_pct'].forEach(k=>d[k]=+d[k]);d.taxable=e.target.taxable.checked?1:0;
  await api('/api/products'+(id?'/'+id:''),{method:id?'PUT':'POST',body:d});closeM();toast('Saved');pgProducts()};
window.pdel=async id=>{if(confirm('Delete product?')){await api('/api/products/'+id,{method:'DELETE'});toast('Deleted');pgProducts()}};
window.impForm=()=>modal(`<h3>Import products</h3>
  <p class="sub" style="margin-bottom:10px">Supports <b>.csv</b>, <b>.json</b>, <b>.xlsx</b>. Columns: <code>barcode, name, price</code> + optional <code>category, brand, cost, stock, taxable, discount_qty, discount_pct, expiry, image</code>. Existing barcodes get updated.</p>
  <div class="row" style="margin-bottom:12px"><button class="btn small" onclick="dlTpl('csv')">⤓ CSV template</button><button class="btn small" onclick="dlTpl('json')">⤓ JSON template</button></div>
  <input type="file" id="impfile" accept=".csv,.json,.xlsx" style="margin-bottom:12px">
  <div id="imprev"></div>
  <div class="row"><button type="button" class="btn" style="flex:1" onclick="closeM()">Cancel</button><button class="btn primary" style="flex:2" onclick="impPreview()">Preview</button></div>`);
window.dlTpl=fmt=>{const hdr="barcode,name,price,cost,stock,category,brand,taxable,discount_qty,discount_pct,expiry,image";
  const row={barcode:"8901",name:"Sample Cola 330ml",price:150,cost:100,stock:50,category:"Drinks",brand:"Coca-Cola",taxable:1};
  const txt=fmt==="csv"?`${hdr}\n8901,Sample Cola 330ml,150,100,50,Drinks,Coca-Cola,1,,,,\n`
    :JSON.stringify([row],null,2);
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));
  a.download=`products-template.${fmt}`;a.click()};
const impBody=async()=>{const f=document.getElementById('impfile').files[0];if(!f)throw"Choose a file";
  if(f.name.endsWith(".xlsx")){const u8=new Uint8Array(await f.arrayBuffer());let s="";
    for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
    return{xlsx_b64:btoa(s)}}
  if(f.name.endsWith(".json"))return{rows:JSON.parse(await f.text())};
  return{csv:await f.text()}};
window.impPreview=async()=>{try{const b=await impBody();b.dry_run=true;
  const r=await api('/api/products/import',{method:'POST',body:b});
  if(r.error)return toast(r.error,1);
  const badge=a=>`<span class="badge ${a==='new'?'ok':a==='update'?'warn':'bad'}">${a}</span>`;
  document.getElementById('imprev').innerHTML=`<p class="sub" style="margin:8px 0"><b>${r.valid}</b> valid · <b>${r.errors}</b> errors</p>
    <div style="max-height:220px;overflow:auto"><table><tr><th></th><th>Name</th><th>Price</th><th>Status</th></tr>
    ${r.plan.map(x=>`<tr><td class="sub">${x.row}</td><td>${esc(x.name)}</td><td>${x.price}</td><td>${badge(x.action)}${x.msg?` <span class="sub">${esc(x.msg)}</span>`:''}</td></tr>`).join('')}</table></div>
    <div class="row" style="margin-top:10px"><button class="btn primary block" ${r.valid?'':'disabled'} onclick="impGo()">✓ Confirm import of ${r.valid} rows</button></div>`}
  catch(e){toast("Import preview failed: "+e,1)}};
window.impGo=async()=>{const r=await api('/api/products/import',{method:'POST',body:await impBody()});
  document.getElementById('imprev').innerHTML=`<p class="sub" style="margin-top:8px"><b style="color:var(--ok)">${r.created} added, ${r.updated} updated</b>${r.skipped?` · <b style="color:var(--warn)">${r.skipped} skipped</b>`:''}${r.errors.map(e=>`<br>· ${esc(e)}`).join('')}</p>`;
  toast('Import complete');pgProducts()};

/* ---------- Inventory ---------- */
async function pgInv(){
  const[d,crit]=await Promise.all([api('/api/stock'),api('/api/critical')]);
  const adm=S.boot.user.role==='admin';
  M.innerHTML=`<div class="top"><h1>Inventory</h1>${adm?'<button class="btn primary" onclick="sForm()">+ Stock entry</button>':''}</div>
  <div class="grid cols">
  <div class="card"><h2>Critical stock (≤10)</h2><table><tr><th>Product</th><th style="text-align:right">Left</th></tr>
    ${crit.map(p=>`<tr><td>${esc(p.name)}</td><td style="text-align:right"><span class="badge ${p.stock<=3?'bad':'warn'}">${p.stock}</span></td></tr>`).join('')||'<tr><td>All good ✓</td></tr>'}</table></div>
  <div class="card"><h2>Stock movements</h2><table><tr><th>Ref</th><th>Product</th><th style="text-align:right">Qty</th><th>Type</th><th>Date</th></tr>
    ${d.entries.map(e=>`<tr><td class="mono">${esc(e.ref_no)}</td><td>${esc(e.product)}</td><td style="text-align:right"><b style="color:${e.qty<0?'var(--bad)':'var(--ok)'}">${e.qty>0?'+':''}${e.qty}</b></td><td><span class="badge ${e.kind==='in'?'ok':'warn'}">${e.kind}</span></td><td>${e.created.slice(0,10)}</td></tr>`).join('')||'<tr><td colspan=5>No movements yet</td></tr>'}</table></div></div>
  <div class="card section"><h2>All stock</h2><table><tr><th>Barcode</th><th>Product</th><th style="text-align:right">Stock</th><th style="text-align:right">Cost</th><th style="text-align:right">Value</th></tr>
    ${d.products.map(p=>`<tr><td class="mono">${esc(p.barcode)}</td><td>${esc(p.name)}</td><td style="text-align:right">${p.stock}</td><td style="text-align:right">${money(p.cost)}</td><td style="text-align:right">${money(p.stock*p.cost)}</td></tr>`).join('')}</table></div>
  ${d.batches?.length?`<div class="card section"><h2>Batches</h2><table><tr><th>Batch</th><th>Product</th><th style="text-align:right">Qty</th><th>Expiry</th><th>Received</th></tr>
    ${d.batches.map(b=>`<tr><td class="mono">${esc(b.batch_no)}</td><td>${esc(b.product)}</td><td style="text-align:right">${b.qty}</td>
    <td>${b.expiry?`<span class="badge ${new Date(b.expiry)<new Date(Date.now()+30*864e5)?'bad':'warn'}">${b.expiry}</span>`:'—'}</td>
    <td>${(b.created_at||'').slice(0,10)}</td></tr>`).join('')}</table></div>`:''}`;
}
window.sForm=()=>api('/api/stock').then(d=>modal(`<h3>Stock entry</h3><form onsubmit="sSave(event)">
  <label>Product<select name="product_id">${d.products.map(p=>`<option value=${p.id}>${esc(p.name)} (have ${p.stock})</option>`).join('')}</select></label>
  <div class="row"><label>Qty (+ restock / − adjust out)<input name="qty" type="number" step="0.01" required></label>
  <label>Supplier<select name="supplier_id"><option value="">—</option>${S.boot.suppliers.map(s=>`<option value=${s.id}>${esc(s.name)}</option>`).join('')}</select></label></div>
  <label>Ref no. (blank = auto)<input name="ref_no"></label>
  <div class="row"><label>Batch no.<input name="batch_no" placeholder="optional — restocks"></label><label>Batch expiry<input name="expiry" type="date"></label></div>
  <label>Note<input name="note" placeholder="Delivery, damage, correction…"></label>
  <div class="row"><button type="button" class="btn" style="flex:1" onclick="closeM()">Cancel</button><button class="btn primary" style="flex:2">Record</button></div></form>`));
window.sSave=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.qty=+d.qty;d.product_id=+d.product_id;
  const r=await api('/api/stock',{method:'POST',body:d});closeM();toast('Stock updated · '+r.ref_no);pgInv()};

/* ---------- Orders ---------- */
async function pgOrders(){
  M.innerHTML=`<div class="top"><h1>Sales</h1><input type="date" id="od" value="${new Date().toISOString().slice(0,10)}"></div>
  <p class="sub" style="margin-bottom:8px">Sales from this hub and every synced device — pick any date.</p>
  <div class="card"><table><tr><th>Invoice</th><th>Cashier</th><th>Device</th><th>Items</th><th>Time</th><th>Status</th><th style="text-align:right">Total</th><th></th></tr><tbody id="ot"></tbody></table></div>`;
  const load=async()=>{const s=await api('/api/sales?date='+od.value);
    ot.innerHTML=s.map(x=>`<tr><td class="mono">${x.invoice_no}</td><td>${esc(x.cashier||x.cashier_name||'—')}</td><td><span class="badge ${x.device?'warn':'ok'}">${esc(x.device||'hub')}</span></td><td>${x.items}</td><td>${tm(x.created)}</td><td><span class="badge ${x.status==='void'?'bad':'ok'}">${x.status}</span></td><td style="text-align:right"><b>${money(x.total)}</b></td>
    <td style="text-align:right"><button class="btn small" onclick="viewRc(${x.id})">View</button> <button class="btn small" onclick="printRc(${x.id})">🖨 Print</button>${x.status==='completed'&&S.boot.user.role==='admin'?` <button class="btn small danger" onclick="voidSale(${x.id})">Void</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8>No sales this day</td></tr>'};
  od.onchange=load;load();
  window._poll=setInterval(()=>{if(!document.hidden)load()},4000);  // live sales feed from every device
}
window.viewRc=async id=>{const rc=await api('/api/receipt/'+id);modal(`<h3>${rc.sale.invoice_no} ${rc.sale.status==='void'?'<span class="badge bad">VOID</span>':''}</h3><div class="rc">${rcHtml(rc)}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Close</button><button class="btn primary" style="flex:2" onclick="printRc(${id})">🖨 Print</button></div>`)};
window.printRc=async id=>{const rc=await api('/api/receipt/'+id);const s=rc.sale,st=rc.settings;
  const w=window.open('','_blank','width=320,height=600');
  w.document.write(`<html><head><title>Receipt ${s.invoice_no}</title><style>body{font-family:monospace;font-size:12px;margin:16px;max-width:280px}h3,p{text-align:center;margin:2px 0}table{width:100%;border-collapse:collapse;margin:8px 0}td{padding:2px 0}.tot{border-top:1px dashed #000;font-weight:700}</style></head><body>
  <h3>${esc(st.store_name||'Nova POS')}</h3><p>${esc(st.store_address||'')}<br>${esc(st.store_phone||'')}</p>
  <p>Receipt <b>${s.invoice_no}</b> · ${td(s.created)}${s.status==='void'?' · <b>VOID</b>':''}</p>
  <table>${rc.items.map(i=>`<tr><td>${esc(i.name)} ×${i.qty}</td><td style="text-align:right">${money(i.total)}</td></tr>`).join('')}
  <tr><td class="tot">TOTAL</td><td class="tot" style="text-align:right">${money(s.total)}</td></tr>
  <tr><td>Cash</td><td style="text-align:right">${money(s.cash)}</td></tr>
  <tr><td>Change</td><td style="text-align:right">${money(s.change_due)}</td></tr>
  <tr><td>VAT incl.</td><td style="text-align:right">${money(s.vat)}</td></tr></table>
  <p>Thank you!</p><script>window.onload=()=>{window.print()}<\/script></body></html>`);
  w.document.close()};
window.voidSale=async id=>{if(confirm('Void this sale? Stock will be returned.')){await api(`/api/sales/${id}/void`,{method:'POST'});toast('Sale voided');pgOrders()}};

/* ---------- Reports ---------- */
async function pgReports(){
  M.innerHTML=`<div class="top"><h1>Reports</h1><input type="date" id="rd" value="${new Date().toISOString().slice(0,10)}">
  <button class="btn" onclick="printRep()">🖨 Print</button><button class="btn primary" onclick="saveRep()">⤓ Save / Drive</button></div>
  <div class="grid cards"><div class="card acc"><div class="k">Revenue</div><div class="v" id="rt">—</div></div>
  <div class="card"><div class="k">Orders</div><div class="v" id="ro">—</div></div></div>
  <div class="grid cols"><div class="card"><h2>Top selling items (all time)</h2><table><tr><th>Product</th><th style="text-align:right">Qty</th><th style="text-align:right">Revenue</th></tr><tbody id="tt"></tbody></table></div>
  <div class="card"><h2>Daily sales list</h2><table><tr><th>Invoice</th><th>Cashier</th><th>Status</th><th style="text-align:right">Total</th></tr><tbody id="dt"></tbody></table></div></div>`;
  const load=async()=>{const r=await api('/api/reports?date='+rd.value);
    rt.textContent=money(r.totals.total);ro.textContent=r.totals.orders;
    tt.innerHTML=r.top.map(x=>`<tr><td>${esc(x.name)}</td><td style="text-align:right">${x.qty}</td><td style="text-align:right"><b>${money(x.revenue)}</b></td></tr>`).join('')||'<tr><td colspan=3>No sales yet</td></tr>';
    dt.innerHTML=r.daily.map(x=>`<tr><td class="mono">${x.invoice_no}</td><td>${esc(x.cashier||'—')}</td><td><span class="badge ${x.status==='void'?'bad':'ok'}">${x.status}</span></td><td style="text-align:right"><b>${money(x.total)}</b></td></tr>`).join('')||'<tr><td colspan=4>No sales this day</td></tr>'};
  rd.onchange=load;load();
}

/* ---------- Report export: print window + share/download (Drive via share sheet) ---------- */
async function repData(){const d=rd.value;const[r,s]=await Promise.all([api('/api/reports?date='+d),api('/api/sales?date='+d)]);return{d,r,s}}
window.printRep=async()=>{const{d,r,s}=await repData();
  const w=window.open('','_blank','width=800,height=700');
  w.document.write(`<html><head><title>Report ${d}</title><style>
  body{font-family:Arial,sans-serif;margin:32px;color:#222;font-size:13px}h1{font-size:20px;margin:0}h2{font-size:14px;margin:22px 0 6px;color:#45209f}
  .kpis{display:flex;gap:12px;margin:16px 0}.kpi{border:1px solid #ddd;border-radius:8px;padding:10px 16px}.kpi b{font-size:18px}
  table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #eee}th{color:#777;font-size:11px}
  .muted{color:#888;font-size:11px}</style></head><body>
  <h1>Daily Report — ${d}</h1><p class="muted">Nova Mart · generated ${new Date().toLocaleString()}</p>
  <div class="kpis"><div class="kpi"><div>Revenue</div><b>${money(r.totals.total)}</b></div><div class="kpi"><div>Orders</div><b>${r.totals.orders}</b></div>
  <div class="kpi"><div>VAT collected</div><b>${money(r.totals.vat||0)}</b></div></div>
  <h2>Top selling items</h2><table><tr><th>Product</th><th>Qty</th><th>Revenue</th></tr>
  ${r.top.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.revenue)}</td></tr>`).join('')||'<tr><td colspan=3>None</td></tr>'}</table>
  <h2>Sales list</h2><table><tr><th>Invoice</th><th>Cashier</th><th>Device</th><th>Time</th><th>Status</th><th>Total</th></tr>
  ${s.map(x=>`<tr><td>${x.invoice_no}</td><td>${esc(x.cashier||x.cashier_name||'—')}</td><td>${esc(x.device||'hub')}</td><td>${tm(x.created)}</td><td>${x.status}</td><td>${money(x.total)}</td></tr>`).join('')||'<tr><td colspan=6>No sales</td></tr>'}</table>
  <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close()};
window.saveRep=async()=>{const{d,r,s}=await repData();
  const csvRows=[["invoice","cashier","device","time","status","total"],
    ...s.map(x=>[x.invoice_no,x.cashier||x.cashier_name||"",x.device||"hub",x.created,x.status,x.total]),
    [],["summary"],["revenue",r.totals.total],["orders",r.totals.orders],["vat",r.totals.vat||0],
    [],["top products"],["name","qty","revenue"],...r.top.map(x=>[x.name,x.qty,x.revenue])];
  const csv=csvRows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const f=new File([csv],`nova-report-${d}.csv`,{type:"text/csv"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:`Report ${d}`});toast("Shared — pick Drive to save")}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click();
       toast("CSV downloaded — upload it to Drive")}};

/* ---------- Users ---------- */

  M.innerHTML=`<div class="top"><h1>Users</h1><button class="btn primary" onclick="uForm()">+ New user</button></div>
  <div class="card"><table><tr><th>Username</th><th>Name</th><th>Role</th><th></th></tr>
  ${us.map(u=>`<tr><td class="mono">${esc(u.username)}</td><td>${esc(u.name)}</td><td><span class="badge ${u.role==='admin'?'warn':'ok'}">${u.role}</span></td>
  <td style="text-align:right"><button class="btn small" onclick="roleTog(${u.id},'${u.role==='admin'?'cashier':'admin'}')" title="Toggle role">⇄ ${u.role==='admin'?'cashier':'admin'}</button> <button class="btn small" onclick="pwForm(${u.id},'${esc(u.username)}')">Password</button> <button class="btn small danger" onclick="udel(${u.id})">✕</button></td></tr>`).join('')}</table></div>
  <div class="card section"><h2>Reset requests${rs.length?` <span class="badge warn">${rs.length}</span>`:''}</h2>
  ${rs.map(r=>`<div class="ci"><span class="nm">${esc(r.uname||r.username)} <span class="sub">· ${esc(r.name||'')}</span></span><span class="sub">${r.created.slice(5,16)}</span>
    <span><button class="btn small primary" onclick="appr(${r.id})">Approve</button> <button class="btn small" onclick="dism(${r.id})">Dismiss</button></span></div>`).join('')||'<p class="hint">No pending requests — when someone clicks "Forgot password" they appear here</p>'}</div>`;
}
window.appr=async id=>{const r=await api(`/api/resets/${id}/approve`,{method:'POST'});
  modal(`<h3>Password reset approved</h3><p class="sub">Give this temporary password to the cashier — they'll be asked to set a new one on login.</p>
  <p class="mono" style="font-size:22px;text-align:center;padding:16px;background:var(--panel2);border-radius:10px"><b>${r.temp}</b></p>
  <div class="row" style="margin-top:14px"><button class="btn primary block" onclick="closeM()">Done</button></div>`);pgUsers()};
window.dism=async id=>{await api(`/api/resets/${id}/dismiss`,{method:'POST'});pgUsers()};
window.uForm=()=>modal(`<h3>New user</h3><form onsubmit="uSave(event)"><div class="row"><label>Username<input name="username" required></label><label>Role<select name="role"><option>cashier</option><option>admin</option></select></label></div><label>Name<input name="name" required></label><label>Password<input name="password" type="password" required></label><div class="row"><button type="button" class="btn" style="flex:1" onclick="closeM()">Cancel</button><button class="btn primary" style="flex:2">Create</button></div></form>`);
window.uSave=async e=>{e.preventDefault();await api('/api/users',{method:'POST',body:Object.fromEntries(new FormData(e.target))});closeM();toast('User created');pgUsers()};
window.udel=async id=>{if(confirm('Delete user?')){await api('/api/users/'+id,{method:'DELETE'});pgUsers()}};
window.pwForm=(id,u)=>modal(`<h3>Reset password · ${u}</h3><form onsubmit="pwSave(event,${id})"><label>New password<input name="password" type="password" required></label><div class="row"><button type="button" class="btn" style="flex:1" onclick="closeM()">Cancel</button><button class="btn primary" style="flex:2">Save</button></div></form>`);
window.pwSave=async(e,id)=>{e.preventDefault();await api(`/api/users/${id}/password`,{method:'POST',body:Object.fromEntries(new FormData(e.target))});closeM();toast('Password updated')};
window.roleTog=async(id,role)=>{await api(`/api/users/${id}/role`,{method:'POST',body:{role}});toast(`Role changed to ${role}`);pgUsers()};

  M.innerHTML=`<div class="top"><h1>Devices</h1><button class="btn primary" onclick="pairTok()">+ Pair a device</button></div>
  <div class="grid cards" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">
    <div class="card"><div class="k">Active devices</div><div class="v">${st.registered_devices}</div></div>
    <div class="card"><div class="k">Latest event seq</div><div class="v">${st.latest_sequence}</div></div>
    <div class="card"><div class="k">Pending to cloud</div><div class="v">${st.outbox_pending_cloud}</div></div>
    <div class="card"><div class="k">Open conflicts</div><div class="v" style="${st.open_conflicts?'color:var(--bad)':''}">${st.open_conflicts}</div></div>
  </div>
  <div class="card section"><div class="ph"><span class="pi"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10 19h4"/></svg></span><h2>Registered devices</h2></div>
  <table><tr><th>Name</th><th>Type</th><th>Status</th><th>Last seen</th><th>Registered</th><th></th></tr>

    <td><span class="badge ${d.active?'ok':'bad'}">${d.active?'active':'revoked'}</span></td>
    <td class="sub">${d.last_seen_at||'never'}</td><td class="sub">${(d.created_at||'').slice(0,10)}</td>
    <td style="text-align:right">${d.active?`<button class="btn small danger" onclick="revokeD(${d.id})">Revoke</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6>No devices paired yet</td></tr>'}</table></div>
  <div class="card section"><div class="ph"><span class="pi"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><h2>Till shifts</h2></div>
  <table><tr><th>Device</th><th>Cashier</th><th>Opened</th><th>Closed</th><th style="text-align:right">Float</th><th style="text-align:right">Expected</th><th style="text-align:right">Counted</th><th style="text-align:right">Diff</th></tr>
  ${shs.map(s=>`<tr><td>${esc(s.device_name||'?')}</td><td>${esc(s.cashier_name||'—')}</td>

  <p class="hint">Pairing flow: click "Pair a device" → on the mobile/other device call <code>POST /api/v1/devices/pair</code> with the token → it gets a <code>device_key</code> used as the <code>X-Device-Key</code> header on <code>/api/v1/sync/*</code>.</p>`;
}
window.pairTok=async()=>{const r=await api('/api/devices',{method:'POST',body:{}});
  const u=r.hub_url||location.origin, payload=encodeURIComponent(JSON.stringify({u,t:r.token}));
  modal(`<h3>Pair a device</h3><p class="sub" style="margin-bottom:10px">On the mobile app: <b>same Wi-Fi</b>, then scan the QR — it fills hub URL + code. Or enter manually:</p>
  <div style="text-align:center"><img src="/api/pair-qr?data=${payload}" width="180" height="180" style="border-radius:10px" onerror="this.style.display='none'"></div>
  <p class="mono" style="text-align:center;padding:10px;background:var(--panel2);border-radius:10px;margin:10px 0 0;font-size:13px">Hub URL: <b>${u}</b></p>
  <p class="mono" style="font-size:26px;text-align:center;padding:14px;background:var(--panel2);border-radius:10px;letter-spacing:.2em;margin:10px 0 0"><b>${r.token}</b></p>
  <div class="row" style="margin-top:14px"><button class="btn primary block" onclick="closeM();pgDevices()">Done</button></div>`)};
window.revokeD=async id=>{if(confirm('Revoke this device? It will lose sync access; its local data stays on the device.')){await api('/api/devices/'+id+'/revoke',{method:'POST'});toast('Device revoked');pgDevices()}};

/* ---------- Camera barcode scan (html5-qrcode — works in Chrome & Firefox) ---------- */
window.camScan=async(inpId)=>{
  modal(`<h3>Scan barcode</h3><div id="scanv" style="width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:280px"></div>
    <p class="sub" style="margin-top:8px">Point the camera at the barcode — fills the search box automatically.</p>
    <div class="row" style="margin-top:10px"><button class="btn block" onclick="stopScan();closeM()">Cancel</button></div>`);
  if(!window.Html5Qrcode){toast("Scanner library not loaded — hard-refresh the page",1);return}
  try{
    const h=new Html5Qrcode("scanv");window._scanQ=h;
    await h.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:170}},txt=>{
      stopScan();closeM();const el=document.getElementById(inpId);
      el.value=txt;el.dispatchEvent(new Event("input"));el.dispatchEvent(new KeyboardEvent("keyup",{key:"Enter"}))},()=>{});
  }catch(e){toast("Camera access denied or unavailable",1);stopScan();closeM()}
};
window.stopScan=()=>{const h=window._scanQ;if(h){window._scanQ=null;h.stop().catch(()=>{})}};
