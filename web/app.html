<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShujaaPOS</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#7c4de8">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#faf8f4;--card:#ffffff;--card2:#f4f1fb;--acc:#7c4de8;--acc2:#6a3cd8;--ok:#1e9e66;--bad:#d04040;--warn:#b07d10;--mut:#6e6884;--txt:#1c1633;--line:#e6e0f2;--line2:#d4cbe8}
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#efe9fb 0%,var(--bg) 60%);color:var(--txt);min-height:100vh;display:flex;align-items:flex-start;justify-content:center}
button{cursor:pointer;font:inherit;color:inherit;border:0;background:none;padding:0}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc2);outline-offset:2px;border-radius:6px}
button.p{padding:13px;border-radius:11px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;transition:background .15s,transform .1s}
button.p:hover:not(:disabled){background:#6a3cd8}button.p:active:not(:disabled){transform:scale(.98)}
button.ghost{padding:11px 13px;border:1px solid var(--line2);border-radius:11px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
button.ghost:hover:not(:disabled){background:var(--card2);border-color:var(--acc)}
button.sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
button.w{width:100%}
button.danger{color:var(--bad);border-color:#efc3c7}button.danger:hover:not(:disabled){background:#fbe9ea;border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px;width:min(420px,92vw);margin-top:10vh;box-shadow:0 24px 60px rgba(60,40,110,.14)}
.card h1{font-size:26px;letter-spacing:-.4px}
.app{width:min(1040px,96vw);padding:26px 0 60px}
h1{font-size:24px;margin:0 0 4px;font-weight:800;letter-spacing:-.4px}.brand{color:var(--acc2)}
.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 6px;letter-spacing:.2px}
input,select{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,77,232,.22)}
.row{display:flex;gap:12px;align-items:center;margin:18px 0}
.line{flex:1;border-top:1px solid var(--line)}
.msg{font-size:13px;margin-top:14px;padding:11px 14px;border-radius:10px}
.err{background:#fbe9ea;color:#b3243a}.okm{background:#e2f4ea;color:#0d6b45}
.tabs{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px}
.tabs .ti{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:14px;font-weight:700;color:var(--mut);transition:all .15s}
.tabs .ti.on{background:var(--acc);color:#fff}
.fplink{display:inline-block;margin-top:16px;font-size:13px;color:var(--acc2);cursor:pointer;background:none;border:0;padding:4px 2px}
.fplink:hover{text-decoration:underline}
.k{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.top h1{font-size:22px}
.nav{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px}
.nav .ni{padding:9px 18px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mut);transition:all .15s}
.nav .ni:hover{color:var(--txt)}
.nav .ni.on{background:var(--acc);color:#fff;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.panel h2{letter-spacing:-.2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-size:11px;padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
tr:hover td{background:rgba(124,77,232,.05)}
tr:last-child td{border:0}
tbody tr.click{cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.kpi .kv{font-size:28px;font-weight:800;letter-spacing:-.5px}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:700;background:#e2f4ea;color:var(--ok)}
.badge.bad{background:#fbe9ea;color:var(--bad)}
.badge.warn{background:#fbf3dc;color:var(--warn)}
.mut{color:var(--mut)}.right{text-align:right}.mono{font-family:ui-monospace,monospace;font-size:12px}
a{color:var(--acc2)}
.poswrap{display:flex;gap:16px;align-items:flex-start}
.pleft{flex:1;min-width:0}
.prow{display:flex;gap:10px;margin-bottom:12px}
.prow select{flex:0 0 auto;width:auto;min-width:130px}
.prow input{flex:1}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;transition:border-color .15s,transform .1s;display:flex;flex-direction:column;gap:6px;min-height:86px;width:100%}
.tile:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.tile:active:not(:disabled){transform:scale(.98)}
.tile:disabled{opacity:.45;cursor:default}
.tile .tn{font-size:14px;font-weight:600;line-height:1.3}
.tile .tp{font-size:15px;font-weight:800;color:var(--acc2);margin-top:auto}
.tile .ts{font-size:11px;color:var(--mut)}
.tile .ts.low{color:var(--bad)}
.cart{width:300px;flex-shrink:0;position:sticky;top:20px}
.cart h2{display:flex;align-items:center;gap:8px}
.cart h2 .sp{flex:1}
.cl{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cl:last-child{border:0}
.cl .qn{font-weight:800;color:var(--acc2);min-width:26px}
.cl .qp{margin-left:auto;color:var(--mut)}
.cl .rm{color:var(--mut);font-size:15px;padding:4px 7px;border-radius:7px;line-height:1}
.cl .rm:hover{color:var(--bad);background:#fbe9ea}
.step{min-width:30px;height:30px;border-radius:7px;background:var(--card2);border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.step:hover{border-color:var(--acc)}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.mchip{padding:9px 15px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);font-size:13px;font-weight:600;color:var(--mut);transition:all .15s}
.mchip:hover{color:var(--txt)}
.mchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ctotal{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 2px;border-top:1px solid var(--line);margin-top:10px}
.ctotal b{font-size:22px;font-weight:800;letter-spacing:-.4px}
.chline{font-size:13px;min-height:18px;margin:6px 0 2px;color:var(--ok)}
.chline.neg{color:var(--bad)}
.cart .p.w,.cart .ghost.w{margin-top:12px}
.cart .ghost.w{margin-top:8px}
.donebox{text-align:center;padding:8px 4px}
.donebox .big{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px}
.donebox .chamt{font-size:34px;font-weight:800;letter-spacing:-.5px;color:var(--ok);margin:10px 0 6px}
.donebox .receipt{font-size:13px;color:var(--mut);margin-bottom:16px}
.mbar{display:none}
.modal{position:fixed;inset:0;background:rgba(28,22,51,.45);display:grid;place-items:center;z-index:50;backdrop-filter:blur(3px);padding:16px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(440px,100%);max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(60,40,110,.18)}
.mbox h2{margin:0 0 14px;letter-spacing:-.2px}
.mbox .cur{font-size:13px;color:var(--mut);margin:-6px 0 12px}
.mbox .cur b{color:var(--txt)}
.mrow{display:flex;gap:10px;margin-top:18px}
.mrow>*{flex:1}
@media(max-width:760px){
  .poswrap{flex-direction:column}
  .pleft{width:100%}
  .cart{width:100%;position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;margin-bottom:0;transform:translateY(110%);transition:transform .22s ease}
  .cart.open{transform:none}
  .mbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(60,40,110,.18)}
  .mbar.show{display:flex}
  .mbar .mt{flex:1;font-size:13.5px;font-weight:600}
  .mbar .mt b{font-size:15px}
}
</style></head>
<body><main id="m"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(CONF.url, CONF.anon);
const M = document.getElementById("m");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ksh = n => "KSh " + (+n || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const tok = () => sb.auth.getSession().then(r => r.data.session?.access_token);
const api = async (p, body) => {
  const t = await tok();
  try {
    const r = await fetch(CONF.api + p, {
      method: body ? "POST" : "GET",
      headers: {Authorization: "Bearer " + t, "Content-Type": "application/json"},
      body: body ? JSON.stringify(body) : undefined});
    return await r.json();
  } catch (e) {
    return {error: "Network error — check your connection and try again.", offline: true};
  }
};

/* ---------- modal ---------- */
const modal = h => {
  document.getElementById("mo").innerHTML =
    `<div class="modal" role="dialog" aria-modal="true"><div class="mbox">${h}</div></div>`;
  const f = document.querySelector(".mbox input, .mbox select, .mbox button");
  if (f) f.focus();
};
const closeM = () => document.getElementById("mo").innerHTML = "";
addEventListener("keydown", e => { if (e.key === "Escape") closeM(); });
addEventListener("click", e => { if (e.target.classList?.contains("modal")) closeM(); });
const confirmM = (msg, label, fn) => {
  window._cf = fn;
  modal(`<h2>${esc(msg)}</h2><div class="mrow"><button class="ghost" onclick="closeM()">Cancel</button>
    <button class="p" onclick="closeM();window._cf()">${esc(label || "Confirm")}</button></div>`);
};

/* ---------- offline queue ---------- */
const queue = () => JSON.parse(localStorage.getItem("shujaa_queue") || "[]");
const saveQueue = q => localStorage.setItem("shujaa_queue", JSON.stringify(q));
const dropped = () => +(localStorage.getItem("shujaa_dropped") || 0);
async function flushQueue() {
  let q = queue(), fails = dropped();
  while (q.length && navigator.onLine) {
    const r = await api("/api/web/sale", q[0]);
    if (r.error && r.offline) break;
    if (r.error) { fails++; localStorage.setItem("shujaa_dropped", fails); q = q.slice(1); continue; }
    q = q.slice(1);
  }
  saveQueue(q);
  syncBadge();
}
function syncBadge() {
  const el = document.getElementById("syncb");
  if (!el) return;
  const n = queue().length, f = dropped();
  const off = !navigator.onLine;
  el.innerHTML = off || n || f
    ? `<span class="badge ${off ? 'bad' : 'warn'}" title="${f ? f + ' sale(s) could not sync' : ''}">${off ? "Offline" : ""}${n ? ` · ${n} queued` : ""}${f && !n ? ` · ${f} failed` : ""}</span>`
    : "";
}
addEventListener("online", () => { syncBadge(); flushQueue(); });
addEventListener("offline", syncBadge);

/* ---------- auth ---------- */
let mode = "up";
function login() {
  M.innerHTML = `<div class="card"><h1>ShujaaPOS</h1>
    <p class="sub">Sell anywhere — offline till, cloud dashboard.</p>
    <div class="tabs" role="tablist"><button class="ti ${mode==='up'?'on':''}" role="tab" aria-selected="${mode==='up'}" onclick="mode='up';login()">Create account</button>
      <button class="ti ${mode==='in'?'on':''}" role="tab" aria-selected="${mode==='in'}" onclick="mode='in';login()">Sign in</button></div>
    <label for="em">Email</label><input id="em" type="email" autocomplete="email">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="${mode==='up'?'new-password':'current-password'}">
    <button class="p w" id="go" style="margin-top:16px" onclick="go()">${mode==='up'?'Create account':'Sign in'}</button>
    ${mode==='in' ? '<button class="fplink" onclick="forgot()">Forgot password?</button>' : ''}
    <div class="row"><div class="line"></div><span class="sub" style="margin:0">or</span><div class="line"></div></div>
    <button class="ghost w" onclick="google()">Continue with Google</button>
    <div id="msg" aria-live="polite"></div></div>`;
  const onEnter = e => { if (e.key === "Enter") go(); };
  document.getElementById("em").onkeydown = onEnter;
  document.getElementById("pw").onkeydown = onEnter;
}
const say = (h, cls) => document.getElementById("msg").innerHTML = `<div class="msg ${cls}">${h}</div>`;
async function go() {
  const btn = document.getElementById("go");
  btn.disabled = true;
  try {
    const r = mode === "up"
      ? await sb.auth.signUp({email: em.value.trim(), password: pw.value})
      : await sb.auth.signInWithPassword({email: em.value.trim(), password: pw.value});
    if (r.error) return say(esc(r.error.message), "err");
    if (mode === "up" && !r.data.session) return say("Check your email — click the verification link, then sign in.", "okm");
    boot();
  } catch (e) {
    say("Something went wrong — check your connection and try again.", "err");
  } finally {
    btn.disabled = false;
  }
}
async function forgot() {
  const e = document.getElementById("em").value.trim();
  if (!e) return say("Enter your email first, then tap Forgot password.", "err");
  const r = await sb.auth.resetPasswordForEmail(e, {redirectTo: location.origin + location.pathname});
  say(r.error ? esc(r.error.message) : "Reset link sent — check your email.", r.error ? "err" : "okm");
}
function google() {
  sb.auth.signInWithOAuth({provider: "google", options: {redirectTo: location.origin + location.pathname}});
}

/* ---------- onboarding ---------- */
function onboard() {
  M.innerHTML = `<div class="card"><h1>Set up your store</h1>
    <p class="sub">This becomes your business — you can add branches after.</p>
    <label for="bn">Store / business name</label><input id="bn" placeholder="e.g. Shujaa Mart">
    <label for="bb">First branch</label><input id="bb" value="Main">
    <button class="p w" style="margin-top:16px" onclick="doOnboard()">Create my store</button><div id="msg" aria-live="polite"></div></div>`;
}
async function doOnboard() {
  const r = await api("/api/onboarding", {business_name: bn.value, branch_name: bb.value});
  if (r.error) return say(esc(r.error), "err");
  boot();
}

/* ---------- app shell ---------- */
let biz = null, role = null, page = "dash", _branches = [];
async function boot() {
  const {data} = await sb.auth.getSession();
  if (!data.session) return login();
  const me = await api("/api/me");
  if (me.error === "unauthorized") return login();
  const ms = me.memberships || [];
  if (!ms.length) return onboard();
  biz = ms[0].businesses; role = ms[0].role;
  const {data: bs} = await sb.from("branches").select("id,name,status").eq("status", "active").order("created_at");
  _branches = bs || [];
  M.innerHTML = `<div class="app">
    <div class="top"><h1>ShujaaPOS <span class="mut" style="font-size:13px;font-weight:400">· ${esc(biz?.name)}</span></h1>
      <span class="sub" style="margin:0"><span id="syncb"></span> ${esc(me.email)} · ${esc(role)} <a href="#" onclick="sb.auth.signOut().then(boot);return false">sign out</a></span></div>
    <div class="nav" id="nav" role="tablist"></div><div id="c"></div></div><div id="mo"></div>`;
  syncBadge(); flushQueue();
  show("dash");
}
const TABS = {dash: "Dashboard", pos: "POS", sales: "Sales", products: "Products", branches: "Branches", reports: "Reports", users: "Users"};
function show(p) {
  page = p;
  document.getElementById("nav").innerHTML =
    Object.entries(TABS).filter(([k]) => k !== "users" || role === "admin")
      .map(([k, l]) => `<button class="ni ${k === p ? 'on' : ''}" role="tab" aria-selected="${k === p}" onclick="show('${k}')">${l}</button>`).join("");
  ({dash, pos, sales, products, branches, reports, users})[p]();
}

/* ---------- pages ---------- */
async function dash() {
  const c = document.getElementById("c");
  c.innerHTML = `<div class="panel">Loading…</div>`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const [{data: s}, {data: p}, {data: b}, {data: d}] = await Promise.all([
    sb.from("sales").select("total,status,created_at"),
    sb.from("products").select("id,active"),
    sb.from("branches").select("id,name"),
    sb.from("devices").select("id,device_name,active,last_seen_at")]);
  const ts = (s || []).filter(x => x.status === "completed" && new Date(x.created_at) >= today);
  const rev = ts.reduce((a, x) => a + +x.total, 0);
  c.innerHTML = `<div class="kpis">
    <div class="kpi"><div class="k">Today's sales</div><div class="kv">${ksh(rev)}</div></div>
    <div class="kpi"><div class="k">Orders today</div><div class="kv">${ts.length}</div></div>
    <div class="kpi"><div class="k">Products</div><div class="kv">${(p || []).filter(x => x.active).length}</div></div>
    <div class="kpi"><div class="k">Branches</div><div class="kv">${(b || []).length}</div></div></div>
    <div class="panel"><h2 style="margin-top:0">Devices</h2>
    ${(d || []).map(x => `<div class="row" style="margin:8px 0"><b>${esc(x.device_name)}</b>
      <span class="badge ${x.active ? '' : 'bad'}">${x.active ? 'active' : 'revoked'}</span>
      <span class="mut" style="margin-left:auto;font-size:12px">${x.last_seen_at ? 'seen ' + new Date(x.last_seen_at).toLocaleString() : 'never seen'}</span></div>`).join("")
      || '<p class="mut">No devices yet — pair a till from the hub or mobile app.</p>'}</div>
    <div class="panel"><h2 style="margin-top:0">Get the apps</h2>
    <p class="mut" style="font-size:14px;margin-top:0">This web till works anywhere with internet. For offline selling install the app:</p>
    <div class="row" style="gap:10px"><a class="p" style="padding:10px 16px;border-radius:9px;text-decoration:none;font-weight:700;font-size:13px;display:inline-block" href="https://github.com/Collinskib/nova-pos/releases/latest">Desktop (Win / Mac / Linux)</a>
    <a class="ghost" style="padding:10px 16px;border-radius:9px;text-decoration:none;font-weight:700;font-size:13px;display:inline-block" href="https://github.com/Collinskib/nova-pos/releases/latest">Android APK</a></div></div>`;
}

const when = s => {
  const d = new Date(s), n = new Date();
  return d.toDateString() === n.toDateString()
    ? d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})
    : d.toLocaleString([], {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
};

async function sales() {
  const c = document.getElementById("c");
  c.innerHTML = `<div class="panel">Loading…</div>`;
  const {data: s} = await sb.from("sales")
    .select("id,receipt_number,total,status,created_at,branches(name),payments(method,amount)")
    .order("created_at", {ascending: false}).limit(50);
  _sales = s || [];
  c.innerHTML = `<div class="panel"><h2 style="margin-top:0">Recent sales</h2><table>
    <thead><tr><th>Receipt</th><th>Branch</th><th>When</th><th>Payment</th><th class="right">Total</th><th></th></tr></thead>
    <tbody id="stb">${_sales.map((x, i) => `<tr class="click" data-si="${i}"><td class="mono">${esc(x.receipt_number)}</td>
      <td>${esc(x.branches?.name || "—")}</td><td class="mut">${when(x.created_at)}</td>
      <td>${(x.payments || []).map(y => esc(y.method)).join(", ") || "—"}</td>
      <td class="right"><b>${ksh(x.total)}</b></td>
      <td><span class="badge ${x.status === 'completed' ? '' : 'bad'}">${esc(x.status)}</span></td></tr>`).join("")
      || '<tr><td colspan=6 class="mut">No sales synced yet</td></tr>'}</tbody></table>
    <p class="mut" style="font-size:12px;margin:10px 0 0">Tap a sale to see its receipt.</p></div>`;
  document.getElementById("stb").addEventListener("click", e => {
    const tr = e.target.closest("tr[data-si]");
    if (tr) saleDetail(_sales[+tr.dataset.si].id);
  });
}
let _sales = [];
async function saleDetail(sid) {
  const r = await api("/api/web/sale/" + sid);
  if (r.error) return;
  const s = r.sale, v = s.status === "completed";
  modal(`<h2>Receipt ${esc(s.receipt_number)} ${v ? "" : '<span class="badge bad">VOID</span>'}</h2>
    <table style="font-size:13.5px">${(r.items || []).map(i => `<tr><td>${esc(i.products?.name || "Item")} ×${+i.quantity}</td>
      <td class="right">${ksh(i.line_total)}</td></tr>`).join("")}

function decCart(id) { if (--cart[id].qty <= 0) delete cart[id]; renderCart(); }
function rmCart(id) { delete cart[id]; renderCart(); }

      : r.change > 0.004 ? `<div class="chamt">${ksh(r.change)}</div><div class="mut" style="font-size:12px;margin-top:-4px">change due</div>`

      : '<div class="chamt">Paid in full</div>'}
    <div class="receipt">Receipt ${esc(r.receipt)} · ${esc(r.method)} · ${ksh(r.total)}${r.customer ? ` · ${esc(r.customer)}` : ""}</div>

async function pay() {
  const rows = Object.values(cart);
  const btn = document.getElementById("chg");
  if (!rows.length || btn.disabled) return;
  const method = payM;
  const total = rows.reduce((a, x) => a + x.qty * x.p.selling_price, 0);
  const tn = +document.getElementById("tender").value;
  const tendered = tn || (method === "credit" ? 0 : total);
  if (method === "cash" && tendered < total) return say("Tendered amount is less than the total.", "err");
  if ((method === "mpesa" || method === "card") && tendered < total) return say("Amount is less than the total.", "err");
  const customer = method === "credit" ? document.getElementById("cust").value.trim() : "";
  if (method === "credit" && !customer) return say("Credit sales need a customer name.", "err");
  btn.disabled = true; btn.textContent = "Charging…";
  const payload = {
    items: rows.map(x => ({product_id: x.p.id, qty: x.qty, unit_price: x.p.selling_price})),
    payments: [{method, amount: tendered}],
    tendered,
    branch_id: curBranch || undefined,
    customer_name: customer || undefined,
    client_ref: "web-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8)};
  try {
    const r = await api("/api/web/sale", payload);
    if (r.error && r.offline) {
      const q = queue(); q.push(payload); saveQueue(q);
      cart = {};
      renderDone({receipt: "QUEUED — syncs when you're back online", total, tendered, method, customer,
        change: Math.max(0, tendered - total), queued: true});
      syncBadge();
      return;
    }
    if (r.error) return say(esc(r.error), "err");
    cart = {};
    renderDone({receipt: r.receipt, total: r.total, tendered, method, customer, change: Math.max(0, tendered - r.total)});
    refreshStockBg();
  } catch (e) {
    say("Network error — the sale may not have gone through. Check the Sales tab before retrying.", "err");
  } finally {
    btn.disabled = false; btn.textContent = "Charge";
  }
}

    <div class="panel"><h2 style="margin-top:0">Top items</h2><table>

      <tbody>${r.top.map(t => `<tr><td>${esc(t.name)}</td><td class="right">${+t.qty}</td><td class="right"><b>${ksh(t.revenue)}</b></td></tr>`).join("")
        || '<tr><td colspan=3 class="mut">Nothing sold on this date</td></tr>'}</tbody></table></div>
    <div class="panel"><h2 style="margin-top:0">Sales</h2><table>
      <thead><tr><th>Receipt</th><th>When</th><th>Customer</th><th class="right">Total</th><th></th></tr></thead>
      <tbody>${r.sales.map(s => `<tr><td class="mono">${esc(s.receipt)}</td><td class="mut">${when(s.when)}</td>
        <td class="mut">${esc(s.customer || "—")}</td><td class="right"><b>${ksh(s.total)}</b></td>
        <td><span class="badge ${s.status === 'completed' ? '' : 'bad'}">${esc(s.status)}</span></td></tr>`).join("")
        || '<tr><td colspan=5 class="mut">No sales this day</td></tr>'}</tbody></table></div>`;
  document.getElementById("rd").onchange = e => { history.replaceState(null, "", "?d=" + e.target.value); reports(); };
  const rb = document.getElementById("rbr");
  if (rb) rb.onchange = () => { curBranch = rb.value; reports(); };
}

/* ---------- users (admin) ---------- */
async function users() {
  const c = document.getElementById("c");
  c.innerHTML = `<div class="panel">Loading…</div>`;
  const ms = await api("/api/web/members");
  if (ms.error) { c.innerHTML = `<div class="panel">${esc(ms.error)}</div>`; return; }
  c.innerHTML = `<div class="panel"><h2 style="margin-top:0">Team · ${ms.length}</h2><table>
    <thead><tr><th>Email</th><th>Role</th><th class="right"></th></tr></thead>
    <tbody id="utb">${ms.map(m => `<tr><td>${esc(m.email || (m.profiles || {}).display_name || m.user_id.slice(0, 8))}</td>
      <td><span class="badge ${m.role === 'admin' ? 'warn' : ''}">${esc(m.role)}</span></td>
      <td class="right"><button class="ghost sm" data-act="role" data-id="${m.user_id}" data-role="${m.role === 'admin' ? 'cashier' : 'admin'}">Make ${m.role === 'admin' ? 'cashier' : 'admin'}</button>
      <button class="ghost sm danger" data-act="rm" data-id="${m.user_id}" style="margin-left:6px">Remove</button></td></tr>`).join("")}</tbody></table>
    <h4 style="margin:18px 0 4px">Add a team member</h4>
    <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:8px">
      <input id="nue" type="email" placeholder="Email" style="flex:2;min-width:160px" aria-label="Email">
      <select id="nur" style="flex:1;min-width:110px" aria-label="Role"><option value="cashier">cashier</option><option value="manager">manager</option><option value="admin">admin</option></select>
      <button class="p" onclick="addMember()">Create login</button></div>
    <p class="mut" style="font-size:12px;margin-top:6px">They sign in at this page with the temp password shown once.</p>
    <div id="msg" aria-live="polite"></div></div>`;
  document.getElementById("utb").addEventListener("click", e => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    if (b.dataset.act === "role") memberRole(b.dataset.id, b.dataset.role);
    else confirmM("Remove this person? Their login loses access to this store.", "Remove", () => memberRm(b.dataset.id));
  });
}
async function memberRole(uid, r) {
  const res = await api("/api/web/members/" + uid + "/role", {role: r});
  if (res.error) return modal(`<h2>Couldn't change role</h2><p class="sub" style="margin:0 0 14px">${esc(res.error)}</p>
    <div class="mrow"><button class="p" onclick="closeM()">OK</button></div>`);
  users();
}
async function memberRm(uid) {
  const res = await api("/api/web/members/" + uid + "/remove", {});
  if (res.error) return modal(`<h2>Couldn't remove</h2><p class="sub" style="margin:0 0 14px">${esc(res.error)}</p>
    <div class="mrow"><button class="p" onclick="closeM()">OK</button></div>`);
  users();
}
async function addMember() {
  const e = document.getElementById("nue").value.trim();
  if (!e) return say("Enter their email.", "err");
  const r = await api("/api/web/members", {email: e, role: document.getElementById("nur").value});
  if (r.error) return say(esc(r.error), "err");
  modal(`<h2>Login created</h2><p class="sub" style="margin:0 0 10px">Give ${esc(e)} this temporary password — they'll set their own after signing in:</p>
    <p class="mono" style="font-size:20px;text-align:center;padding:14px;background:var(--card2);border-radius:10px;margin:0 0 14px"><b>${esc(r.temp_password)}</b></p>
    <div class="mrow"><button class="p" onclick="closeM();users()">Done</button></div>`);
}

/* ---------- branches ---------- */
async function branches() {
  const c = document.getElementById("c");
  c.innerHTML = `<div class="panel">Loading…</div>`;
  const {data: b} = await sb.from("branches").select("*").order("created_at");
  c.innerHTML = `<div class="panel"><h2 style="margin-top:0">Branches</h2><table>
    <thead><tr><th>Name</th><th>Address</th><th class="right">Status</th></tr></thead>
    <tbody>${(b || []).map(x => `<tr><td><b>${esc(x.name)}</b></td><td class="mut">${esc(x.address || "—")}</td>
      <td class="right"><span class="badge ${x.status !== "active" ? "bad" : ""}">${esc(x.status)}</span>
      ${role === "admin" ? ` <button class="ghost sm" data-ebid="${x.id}" data-ebname="${esc(x.name)}" data-ebaddr="${esc(x.address || "")}" style="margin-left:8px">Edit</button>` : ""}
      ${role === "admin" && x.status === "active" ? ` <button class="ghost sm danger" data-bid="${x.id}" data-bname="${esc(x.name)}" style="margin-left:6px">Deactivate</button>` : ""}</td></tr>`).join("")}</tbody></table>
    ${role === "admin" ? `<h4 style="margin:18px 0 4px">Add a branch</h4>
    <div class="row" style="margin-top:8px"><input id="nbn" placeholder="Branch name" style="flex:2" aria-label="Branch name">
      <input id="nba" placeholder="Address (optional)" style="flex:2" aria-label="Address">
      <button class="p" onclick="addBranch()">Add</button></div><div id="msg" aria-live="polite"></div>` : ""}</div>`;
  c.querySelectorAll("button[data-bid]").forEach(btn => btn.onclick = () =>
    confirmM(`Deactivate ${btn.dataset.bname}? Sales history stays; the branch stops taking new sales.`, "Deactivate",
      () => delBranch(btn.dataset.bid)));
  c.querySelectorAll("button[data-ebid]").forEach(btn => btn.onclick = () =>
    editBranch(btn.dataset.ebid, btn.dataset.ebname, btn.dataset.ebaddr));
}
function editBranch(id, name, addr) {
  modal(`<h2>Edit branch</h2><form onsubmit="saveBranch(event,'${id}')">
    <label for="eb-n">Name</label><input id="eb-n" value="${esc(name)}" required>
    <label for="eb-a">Address</label><input id="eb-a" value="${esc(addr)}" placeholder="optional">
    <div class="mrow"><button type="button" class="ghost" onclick="closeM()">Cancel</button>
    <button class="p">Save</button></div></form>`);
}
async function saveBranch(e, id) {
  e.preventDefault();
  const r = await api("/api/branches/update", {business_id: biz.id, branch_id: id,
    name: document.getElementById("eb-n").value.trim(), address: document.getElementById("eb-a").value.trim()});
  if (r.error || !r.ok) return modal(`<h2>Couldn't save</h2><p class="sub" style="margin:0 0 14px">${esc(r.error || "failed")}</p>
    <div class="mrow"><button class="p" onclick="closeM()">OK</button></div>`);
  const {data: bs} = await sb.from("branches").select("id,name,status").eq("status", "active").order("created_at");
  _branches = bs || [];
  closeM(); branches();
}
async function delBranch(id) {
  const r = await api("/api/branches/delete", {business_id: biz.id, branch_id: id});
  if (r.error || !r.ok) return modal(`<h2>Couldn't deactivate</h2><p class="sub" style="margin:0 0 14px">${esc(r.error || "failed")}</p>
    <div class="mrow"><button class="p" onclick="closeM()">OK</button></div>`);
  branches();
}
async function addBranch() {
  if (!nbn.value.trim()) return say("Give the branch a name.", "err");
  const r = await api("/api/branches", {business_id: biz.id, name: nbn.value.trim(), address: nba.value});
  if (r.error) return say(esc(r.error), "err");
  branches();
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
sb.auth.onAuthStateChange((e, s) => { if (e === "SIGNED_IN" || e === "SIGNED_OUT") boot(); });
boot();
