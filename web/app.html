<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShujaaPOS</title>
<style>
:root{--bg:#0b0817;--card:#191333;--card2:#221b45;--acc:#8b5cf6;--acc2:#a78bfa;--ok:#3ecf8e;--bad:#e05a5a;--mut:#9a93c2;--txt:#f0eeff;--line:#2e2657;--line2:#3a3069}
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#1c1440 0%,var(--bg) 60%);color:var(--txt);min-height:100vh;display:flex;align-items:flex-start;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px;width:min(420px,92vw);margin-top:10vh;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.card h1{font-size:26px;letter-spacing:-.4px}
.app{width:min(1040px,96vw);padding:26px 0 60px}
h1{font-size:24px;margin:0 0 4px;font-weight:800;letter-spacing:-.4px}.brand{color:var(--acc2)}
.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 6px;letter-spacing:.2px}
input,select{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:#12102a;color:var(--txt);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
button{padding:13px;border:0;border-radius:11px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;margin-top:16px;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:#7c4de8}button:active{transform:scale(.98)}
button.ghost{background:transparent;border:1px solid var(--line2)}button.ghost:hover{background:#241d4d;border-color:var(--acc)}
button.w{width:100%}
.row{display:flex;gap:12px;align-items:center;margin:18px 0}
.line{flex:1;border-top:1px solid var(--line)}
.msg{font-size:13px;margin-top:14px;padding:11px 14px;border-radius:10px}
.err{background:#3d1a2a;color:#ffb3b8}.okm{background:#14352a;color:#8ff0c4}
.tabs{display:flex;gap:4px;background:#12102a;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px}
.tabs span{flex:1;text-align:center;padding:9px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:700;color:var(--mut);transition:all .15s}
.tabs span.on{background:var(--acc);color:#fff}
.k{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.top h1{font-size:22px}
.nav{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;background:#12102a;border:1px solid var(--line);border-radius:12px;padding:4px}
.nav span{padding:9px 18px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;color:var(--mut);transition:all .15s}
.nav span:hover{color:var(--txt)}
.nav span.on{background:var(--acc);color:#fff;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.panel h3{letter-spacing:-.2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-size:11px;padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
td{padding:11px 10px;border-bottom:1px solid #221c4a}
tr:hover td{background:rgba(139,92,246,.04)}
tr:last-child td{border:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.kpi .kv{font-size:28px;font-weight:800;letter-spacing:-.5px}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:700;background:#14352a;color:var(--ok)}
.badge.bad{background:#3d1a2a;color:var(--bad)}
.mut{color:var(--mut)}.right{text-align:right}.mono{font-family:ui-monospace,monospace;font-size:12px}
a{color:var(--acc2)}
.poswrap{display:flex;gap:16px;align-items:flex-start}
.pgrid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .15s,transform .1s;display:flex;flex-direction:column;gap:6px;min-height:86px}
.tile:hover{border-color:var(--acc);transform:translateY(-1px)}
.tile:active{transform:scale(.98)}
.tile.out{opacity:.45;pointer-events:none}
.tile .tn{font-size:14px;font-weight:600;line-height:1.3}
.tile .tp{font-size:15px;font-weight:800;color:var(--acc2);margin-top:auto}
.tile .ts{font-size:11px;color:var(--mut)}
.tile .ts.low{color:var(--bad)}
.cart{width:300px;flex-shrink:0;position:sticky;top:20px}
.cl{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #221c4a;font-size:14px}
.cl:last-child{border:0}
.cl .qn{font-weight:800;color:var(--acc2);min-width:26px}
.cl .qp{margin-left:auto;color:var(--mut)}
.step{width:24px;height:24px;border-radius:7px;background:#12102a;border:1px solid var(--line2);color:var(--txt);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;font-size:14px}
.step:hover{border-color:var(--acc)}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.mchips span{padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:#12102a;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;transition:all .15s}
.mchips span.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ctotal{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 2px;border-top:1px solid var(--line);margin-top:10px}
.ctotal b{font-size:22px;font-weight:800;letter-spacing:-.4px}
footer{padding:26px;text-align:center;color:var(--mut);font-size:13px}
@media(max-width:760px){.poswrap{flex-direction:column}.cart{width:100%;position:static}}
</style></head>
<body><main id="m"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(CONF.url, CONF.anon);
const M = document.getElementById("m");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ksh = n => "KSh " + (+n || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const tok = () => sb.auth.getSession().then(r => r.data.session?.access_token);
const api = (p, body) => tok().then(t => fetch(CONF.api + p, {
  method: body ? "POST" : "GET", headers: {Authorization: "Bearer " + t, "Content-Type": "application/json"},
  body: body ? JSON.stringify(body) : undefined}).then(r => r.json()));

/* ---------- auth ---------- */
let mode = "up";
function login() {
  M.innerHTML = `<div class="card"><h1>ShujaaPOS</h1>
    <p class="sub">Sell anywhere — offline till, cloud dashboard.</p>
    <div class="tabs"><span class="${mode==='up'?'on':''}" onclick="mode='up';login()">Create account</span>
      <span class="${mode==='in'?'on':''}" onclick="mode='in';login()">Sign in</span></div>
    <label>Email<input id="em" type="email" autocomplete="email"></label>
    <label>Password<input id="pw" type="password"></label>
    <button class="w" id="go" onclick="go()">${mode==='up'?'Create account':'Sign in'}</button>
    <div class="row"><div class="line"></div><span class="sub" style="margin:0">or</span><div class="line"></div></div>
    <button class="ghost w" onclick="google()">Continue with Google</button>
    <div id="msg"></div></div>`;
  document.getElementById("pw").onkeydown = e => { if (e.key === "Enter") go(); };
}
const say = (h, cls) => document.getElementById("msg").innerHTML = `<div class="msg ${cls}">${h}</div>`;
async function go() {
  go.disabled = true;
  const r = mode === "up"
    ? await sb.auth.signUp({email: em.value.trim(), password: pw.value})
    : await sb.auth.signInWithPassword({email: em.value.trim(), password: pw.value});
  go.disabled = false;
  if (r.error) return say(esc(r.error.message), "err");
  if (mode === "up" && !r.data.session) return say("Check your email — click the verification link, then sign in.", "okm");
  boot();
}
function google() {
  sb.auth.signInWithOAuth({provider: "google", options: {redirectTo: location.origin + location.pathname}});
}

/* ---------- onboarding ---------- */
function onboard() {
  M.innerHTML = `<div class="card"><h1>Set up your store</h1>
    <p class="sub">This becomes your business — you can add branches after.</p>
    <label>Store / business name<input id="bn" placeholder="e.g. Shujaa Mart"></label>
    <label>First branch<input id="bb" value="Main"></label>
    <button class="w" onclick="doOnboard()">Create my store</button><div id="msg"></div></div>`;
}
async function doOnboard() {
  const r = await api("/api/onboarding", {business_name: bn.value, branch_name: bb.value});
  if (r.error) return say(esc(r.error), "err");
  boot();
}

/* ---------- app shell ---------- */
let biz = null, role = null, page = "dash";
async function boot() {
  const {data} = await sb.auth.getSession();
  if (!data.session) return login();
  const me = await api("/api/me");
  if (me.error === "unauthorized") return login();
  const ms = me.memberships || [];
  if (!ms.length) return onboard();
  biz = ms[0].businesses; role = ms[0].role;
  M.innerHTML = `<div class="app">
    <div class="top"><h1>ShujaaPOS <span class="mut" style="font-size:13px;font-weight:400">· ${esc(biz?.name)}</span></h1>
      <span class="sub" style="margin:0">${esc(me.email)} · ${esc(role)} <a href="#" onclick="sb.auth.signOut().then(boot);return false">sign out</a></span></div>
    <div class="nav" id="nav"></div><div id="c"></div></div>`;
  show("dash");
}
const TABS = {dash: "Dashboard", pos: "POS", sales: "Sales", products: "Products", branches: "Branches"};
function show(p) {
  page = p;
  document.getElementById("nav").innerHTML =
    Object.entries(TABS).map(([k, l]) => `<span class="${k === p ? 'on' : ''}" onclick="show('${k}')">${l}</span>`).join("");
  ({dash, pos, sales, products, branches})[p]();
}

/* ---------- pages ---------- */
async function dash() {
  const c = document.getElementById("c");
  c.innerHTML = `<div class="panel">Loading…</div>`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const [{data: s}, {data: p}, {data: b}, {data: d}] = await Promise.all([
    sb.from("sales").select("total,status,created_at"),
    sb.from("products").select("id,active"),
    sb.from("branches").select("id,name"),
    sb.from("devices").select("id,device_name,active,last_seen_at")]);
  const ts = (s || []).filter(x => x.status === "completed" && new Date(x.created_at) >= today);
  const rev = ts.reduce((a, x) => a + +x.total, 0);
  c.innerHTML = `<div class="kpis">
    <div class="kpi"><div class="k">Today's sales</div><div class="kv">${ksh(rev)}</div></div>
    <div class="kpi"><div class="k">Orders today</div><div class="kv">${ts.length}</div></div>
    <div class="kpi"><div class="k">Products</div><div class="kv">${(p || []).length}</div></div>
    <div class="kpi"><div class="k">Branches</div><div class="kv">${(b || []).length}</div></div></div>
    <div class="panel"><h3 style="margin-top:0">Devices</h3>
    ${(d || []).map(x => `<div class="row" style="margin:8px 0"><b>${esc(x.device_name)}</b>
      <span class="badge ${x.active ? '' : 'bad'}">${x.active ? 'active' : 'revoked'}</span>
      <span class="mut" style="margin-left:auto;font-size:12px">${x.last_seen_at ? 'seen ' + new Date(x.last_seen_at).toLocaleString() : 'never seen'}</span></div>`).join("")
      || '<p class="mut">No devices yet — pair a till from the hub or mobile app.</p>'}</div>
    <div class="panel"><h3 style="margin-top:0">Get the apps</h3>
    <p class="mut" style="font-size:14px;margin-top:0">This web till works anywhere with internet. For offline selling install the app:</p>
    <div class="row" style="gap:10px"><a href="https://github.com/Collinskib/nova-pos/releases/latest" style="background:var(--acc);color:#fff;padding:10px 16px;border-radius:9px;text-decoration:none;font-weight:700;font-size:13px">Desktop (Win / Mac / Linux)</a>
    <a href="https://github.com/Collinskib/nova-pos/releases/latest" style="background:var(--acc);color:#fff;padding:10px 16px;border-radius:9px;text-decoration:none;font-weight:700;font-size:13px">Android APK</a></div></div>`;
}
async function sales() {
  const c = document.getElementById("c");
  c.innerHTML = `<div class="panel">Loading…</div>`;
  const {data: s} = await sb.from("sales")
    .select("receipt_number,total,status,created_at,branches(name),payments(method,amount)")
    .order("created_at", {ascending: false}).limit(50);
  c.innerHTML = `<div class="panel"><h3 style="margin-top:0">Recent sales</h3><table>
    <tr><th>Receipt</th><th>Branch</th><th>When</th><th>Payment</th><th class="right">Total</th><th></th></tr>
    ${(s || []).map(x => `<tr><td class="mono">${esc(x.receipt_number)}</td>
      <td>${esc(x.branches?.name || "—")}</td><td class="mut">${new Date(x.created_at).toLocaleString()}</td>
      <td>${(x.payments || []).map(y => esc(y.method)).join(", ") || "—"}</td>
      <td class="right"><b>${ksh(x.total)}</b></td>
      <td><span class="badge ${x.status === 'completed' ? '' : 'bad'}">${esc(x.status)}</span></td></tr>`).join("")
      || '<tr><td colspan=6 class="mut">No sales synced yet</td></tr>'}</table></div>`;
}
async function products() {
  const c = document.getElementById("c");
  c.innerHTML = `<div class="panel">Loading…</div>`;
  const {data: p} = await sb.from("products").select("id,name,sku,barcode,selling_price,cost_price,active").order("name");
  c.innerHTML = `<div class="panel"><h3 style="margin-top:0">Products · ${(p || []).length}</h3><table>
    <tr><th>Name</th><th>Barcode / SKU</th><th class="right">Price</th><th class="right">Cost</th><th></th></tr>
    ${(p || []).map(x => `<tr><td>${esc(x.name)}</td><td class="mono mut">${esc(x.barcode || x.sku || "—")}</td>
      <td class="right"><b>${ksh(x.selling_price)}</b></td><td class="right mut">${ksh(x.cost_price)}</td>
      <td><span class="badge ${x.active ? '' : 'bad'}">${x.active ? 'active' : 'off'}</span>
      <a href="#" onclick="editProd('${x.id}','${esc(x.name)}',${x.selling_price});return false" style="margin-left:8px">price</a>
      <a href="#" onclick="adjStock('${x.id}','${esc(x.name)}');return false" style="margin-left:6px">stock</a></td></tr>`).join("")
      || '<tr><td colspan=5 class="mut">No products yet.</td></tr>'}</table>
    <h4 style="margin:18px 0 4px">Add a product</h4>
    <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:8px"><input id="npn" placeholder="Name" style="flex:2;min-width:120px">
      <input id="npp" type="number" placeholder="Price" style="flex:1;min-width:80px">
      <input id="npc" type="number" placeholder="Cost" style="flex:1;min-width:80px">
      <input id="npb" placeholder="Barcode" style="flex:1;min-width:90px">
      <button onclick="addProd()" style="margin:0">Add</button></div>
    <p class="mut" style="font-size:12px;margin-top:6px">New and changed products sync to the hub and mobile automatically.</p><div id="msg"></div></div>`;
}
async function branches() {
  const c = document.getElementById("c");
  c.innerHTML = `<div class="panel">Loading…</div>`;
  const {data: b} = await sb.from("branches").select("*").order("created_at");
  c.innerHTML = `<div class="panel"><h3 style="margin-top:0">Branches</h3><table>
    <tr><th>Name</th><th>Address</th><th class="right">Status</th></tr>
    ${(b || []).map(x => `<tr><td><b>${esc(x.name)}</b></td><td class="mut">${esc(x.address || "—")}</td>
      <td class="right"><span class="badge ${x.status!=="active"?"bad":""}">${esc(x.status)}</span>
      ${role === "admin" && x.status === "active" ? `<a href="#" onclick="delBranch('${x.id}','${esc(x.name)}');return false" class="mut" style="margin-left:8px">deactivate</a>` : ""}</td></tr>`).join("")}</table>
    ${role === "admin" ? `<h4 style="margin:18px 0 4px">Add a branch</h4>
    <div class="row" style="margin-top:8px"><input id="nbn" placeholder="Branch name" style="flex:2">
      <input id="nba" placeholder="Address (optional)" style="flex:2">
      <button onclick="addBranch()" style="margin:0">Add</button></div><div id="msg"></div>` : ""}</div>`;
}

let cart = {}, _prods = [];
async function pos() {
  const c = document.getElementById("c");
  c.innerHTML = `<div class="panel">Loading…</div>`;
  const t = await tok();
  const prods = await (await fetch(CONF.api + "/api/web/products", {headers: {Authorization: "Bearer " + t}})).json();
  if (prods.error) { c.innerHTML = `<div class="panel">${esc(prods.error)}</div>`; return; }
  _prods = prods;
  c.innerHTML = `<div class="poswrap"><div class="pgrid">
    ${prods.map((p, i) => `<div class="tile ${p.stock<=0?'out':''}" onclick="addCart(${i})"><span class="tn">${esc(p.name)}</span><span class="ts ${p.stock<=10?'low':''}">${p.stock<=0?'out of stock':p.stock+' left'}</span><span class="tp">${ksh(p.selling_price)}</span></div>`).join("")
      || '<p class="mut">No products yet — add them on the hub; they sync here.</p>'}</div>
    <div class="panel cart"><h3 style="margin-top:0">Cart</h3><div id="cart"></div>
    <div class="mchips" id="mch">${["cash","mpesa","card","credit"].map((m,i)=>`<span class="${i===0?'on':''}" onclick="selM(this,'${m}')">${m}</span>`).join("")}</div>
    <input id="tender" type="number" placeholder="Amount tendered" style="margin-bottom:4px">
    <div class="ctotal"><span class="mut" style="font-size:13px">Total</span><b id="ct">KSh 0.00</b></div>
    <button class="w" onclick="pay()" id="chg">Charge</button><div id="msg"></div></div></div>`;
  renderCart();
}
function addCart(i) {
  const p = _prods[i];
  cart[p.id] = {p, qty: (cart[p.id]?.qty || 0) + 1};
  renderCart();
}
function decCart(id) { if (--cart[id].qty <= 0) delete cart[id]; renderCart(); }
function renderCart() {
  const rows = Object.values(cart);
  document.getElementById("cart").innerHTML = rows.map(x => `<div class="cl">
    <span class="qn">${x.qty}×</span><span>${esc(x.p.name)}</span>
    <span class="qp">${ksh(x.qty * x.p.selling_price)}</span>
    <span class="step" onclick="decCart('${x.p.id}')">−</span>
    <span class="step" onclick="addCart2('${x.p.id}')">+</span></div>`).join("")
    || '<p class="mut" style="font-size:14px;padding:8px 0">Tap products to add.</p>';
  document.getElementById("ct").textContent = ksh(rows.reduce((a, x) => a + x.qty * x.p.selling_price, 0));
}
let payM = "cash";
function selM(el, m) { payM = m; [...el.parentNode.children].forEach(x => x.classList.remove("on")); el.classList.add("on"); }
function addCart2(id) { const x = cart[id]; if (x) { x.qty++; renderCart(); } }
async function pay() {
  const rows = Object.values(cart);
  if (!rows.length) return;
  const method = payM;
  const total = rows.reduce((a, x) => a + x.qty * x.p.selling_price, 0);
  const tendered = +document.getElementById("tender").value || total;
  if (method !== "credit" && tendered < total) return say("Tendered amount is less than the total.", "err");
  const r = await api("/api/web/sale", {items: rows.map(x => ({product_id: x.p.id, qty: x.qty, unit_price: x.p.selling_price})),
    payments: [{method, amount: tendered}], tendered});
  if (r.error) return say(esc(r.error), "err");
  cart = {};
  const change = tendered - r.total;
  say(`Done — receipt ${esc(r.receipt)} · ${ksh(r.total)}${change > 0 ? ` · change ${ksh(change)}` : ""}`, "okm");
  document.getElementById("tender").value = "";
  pos();
}

async function addProd() {
  const r = await api("/api/web/product", {name: npn.value, price: +npp.value || 0, cost: +npc.value || 0, barcode: npb.value});
  if (r.error || !r.ok) return say(esc(r.error || "failed"), "err");
  products();
}
async function editProd(id, name, price) {
  const v = prompt(`New price for ${name} (KSh)`, price);
  if (v === null) return;
  const r = await api("/api/web/product", {id, name, price: +v});
  if (r.error || !r.ok) return say(esc(r.error || "failed"), "err");
  products();
}
async function adjStock(id, name) {
  const v = prompt(`Stock adjustment for ${name} — e.g. 24 to receive, -3 damaged`, "0");
  if (v === null || isNaN(+v)) return;
  const r = await api("/api/web/stock", {product_id: id, delta: +v, note: "web adjust"});
  if (r.error || !r.ok) return say(esc(r.error || "failed"), "err");
  say("Stock updated — syncs to your tills.", "okm");
}
async function delBranch(id, name) {
  if (!confirm(`Deactivate ${name}? Sales history stays; the branch just stops taking new sales.`)) return;
  const r = await api("/api/branches/delete", {business_id: biz.id, branch_id: id});
  if (r.error || !r.ok) return alert(r.error || "failed");
  branches();
}
async function addBranch() {
  const r = await api("/api/branches", {business_id: biz.id, name: nbn.value, address: nba.value});
  if (r.error) return say(esc(r.error), "err");
  branches();
}
sb.auth.onAuthStateChange((e, s) => { if (e === "SIGNED_IN" || e === "SIGNED_OUT") boot(); });
boot();
