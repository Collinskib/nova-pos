name: builds

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgtk-3-0

      - name: Install build deps
        run: pip install flask waitress pywebview pyinstaller

      - name: Build binary
        run: pyinstaller mauzo.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mauzo-pos-${{ runner.os }}
          path: dist/

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mauzo-pos-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
