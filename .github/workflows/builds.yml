name: builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Restrict to ARM ABIs
        run: |
          cd android
          sed -i 's/^#\?reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' gradle.properties
          grep -q '^reactNativeArchitectures=' gradle.properties || echo 'reactNativeArchitectures=armeabi-v7a,arm64-v8a' >> gradle.properties
          grep '^reactNativeArchitectures=' gradle.properties

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shujaa-pos-android-arm
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
