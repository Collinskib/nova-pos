name: builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-13]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgtk-3-0

      - name: Install build deps
        run: pip install flask waitress pywebview pyinstaller

      - name: Build binary
        run: pyinstaller mauzo.spec

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/mauzo-pos AppDir/usr/bin/
          cp static/icon.png AppDir/mauzo-pos.png
          cat > AppDir/mauzo-pos.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Mauzo POS
          Exec=mauzo-pos
          Icon=mauzo-pos
          Categories=Office;
          EOF
          printf '#!/bin/sh\nexec "$APPDIR/usr/bin/mauzo-pos" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir dist/mauzo-pos-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mauzo-pos-${{ matrix.os }}
          path: dist/

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mauzo-pos-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
