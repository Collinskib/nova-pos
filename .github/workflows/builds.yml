name: builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-13]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgtk-3-0

      - name: Install build deps
        run: pip install flask waitress pywebview pyinstaller

      - name: Build binary
        run: pyinstaller shujaa.spec

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/shujaa-pos AppDir/usr/bin/
          cp static/icon.png AppDir/shujaa-pos.png
          cat > AppDir/shujaa-pos.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ShujaaPOS
          Exec=shujaa-pos
          Icon=shujaa-pos
          Categories=Office;
          EOF
          printf '#!/bin/sh\nexec "$APPDIR/usr/bin/shujaa-pos" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fL --retry 5 --retry-all-errors --retry-delay 10 -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir dist/shujaa-pos-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shujaa-pos-${{ matrix.os }}
          path: dist/

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Restrict to ARM ABIs
        run: |
          cd android
          sed -i 's/^#\?reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' gradle.properties
          grep -q '^reactNativeArchitectures=' gradle.properties || echo 'reactNativeArchitectures=armeabi-v7a,arm64-v8a' >> gradle.properties
          grep '^reactNativeArchitectures=' gradle.properties

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shujaa-pos-android-arm
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
