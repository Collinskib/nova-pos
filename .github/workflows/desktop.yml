name: desktop-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact: mauzo-pos.exe
          - os: ubuntu-latest
            artifact: mauzo-pos
          - os: macos-latest
            artifact: Mauzo POS.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgtk-3-0

      - name: Install build deps
        run: pip install flask waitress pywebview pyinstaller

      - name: Build binary
        run: pyinstaller mauzo.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mauzo-pos-${{ runner.os }}
          path: dist/
